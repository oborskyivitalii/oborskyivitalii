<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#54d2e5"/></marker></defs><rect width="100%" height="100%" fill="#0b1726"/><text x="48" y="65" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="bold" text-anchor="start">Control must reach the consequence</text><text x="48" y="110" fill="#a9bbce" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="normal" text-anchor="start">Illustrative access-recovery assistant · one possible control path</text><rect x="65" y="160" width="700" height="95" rx="16" fill="#15283d" stroke="#35516b" stroke-width="2"/><text x="90" y="199" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal" text-anchor="start">Authorised request + access-scoped context</text><polyline points="415,260 415,295" fill="none" stroke="#54d2e5" stroke-width="4"/><polygon points="415.0,295.0 422.0,282.0 408.0,282.0" fill="#54d2e5"/><rect x="65" y="305" width="700" height="85" rx="16" fill="#15283d" stroke="#35516b" stroke-width="2"/><text x="90" y="358" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="start">Model proposes guidance or action</text><polyline points="415,395 415,425" fill="none" stroke="#54d2e5" stroke-width="4"/><polygon points="415.0,425.0 422.0,412.0 408.0,412.0" fill="#54d2e5"/><rect x="65" y="435" width="700" height="120" rx="16" fill="#15283d" stroke="#54d2e5" stroke-width="2"/><text x="90" y="477" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal" text-anchor="start">Required checks, permissions and approval</text><text x="90" y="514" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal" text-anchor="start">Semantic checking can be wrong.</text><polyline points="415,560 415,605" fill="none" stroke="#54d2e5" stroke-width="4"/><polygon points="415.0,605.0 422.0,592.0 408.0,592.0" fill="#54d2e5"/><text x="435" y="593" fill="#54d2e5" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start">Satisfied</text><rect x="65" y="615" width="700" height="85" rx="16" fill="#15283d" stroke="#35516b" stroke-width="2"/><text x="90" y="668" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="normal" text-anchor="start">Deliver the response or execute the action</text><rect x="835" y="430" width="300" height="165" rx="16" fill="#15283d" stroke="#f3b85d" stroke-width="2"/><text x="860" y="473" fill="#f3b85d" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="start">Deny, clarify</text><text x="860" y="511" fill="#f3b85d" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="start">or use fallback</text><text x="860" y="555" fill="#a9bbce" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Failed / unavailable</text><polyline points="770,488 825,488" fill="none" stroke="#54d2e5" stroke-width="4"/><polygon points="825.0,488.0 812.0,481.0 812.0,495.0" fill="#54d2e5"/><polyline points="415,705 415,750" fill="none" stroke="#54d2e5" stroke-width="4"/><polygon points="415.0,750.0 422.0,737.0 408.0,737.0" fill="#54d2e5"/><rect x="65" y="760" width="1070" height="95" rx="16" fill="#15283d" stroke="#35516b" stroke-width="2"/><text x="90" y="817" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="normal" text-anchor="start">Observe outcomes and control health</text><polyline points="985,600 985,750" fill="none" stroke="#54d2e5" stroke-width="4"/><polygon points="985.0,750.0 992.0,737.0 978.0,737.0" fill="#54d2e5"/><polyline points="415,860 415,900" fill="none" stroke="#54d2e5" stroke-width="4"/><polygon points="415.0,900.0 422.0,887.0 408.0,887.0" fill="#54d2e5"/><rect x="65" y="910" width="1070" height="110" rx="16" fill="#15283d" stroke="#35516b" stroke-width="2"/><text x="90" y="952" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="normal" text-anchor="start">Authorised intervention → verify its effect → reassess</text><text x="90" y="988" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="normal" text-anchor="start">Enough evidence, competence, authority and time to act</text><polyline points="65,965 30,965 30,207 60,207" fill="none" stroke="#54d2e5" stroke-width="4"/><polygon points="60.0,207.0 47.0,200.0 47.0,214.0" fill="#54d2e5"/><text x="65" y="1075" fill="#54d2e5" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="normal" text-anchor="start">Intervention informs the next request and operating limits.</text><text x="65" y="1110" fill="#a9bbce" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start">A later correction cannot necessarily reverse an earlier consequence.</text><text x="48" y="1152" fill="#a9bbce" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Vitalii Oborskyi  /  AI Changes Both Sides of Software Engineering</text></svg>