<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#54d2e5"/></marker></defs><rect width="100%" height="100%" fill="#0b1726"/><text x="48" y="65" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="bold" text-anchor="start">Two independent changes</text><text x="48" y="110" fill="#a9bbce" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="normal" text-anchor="start">How we build software  ×  What the running product depends on</text><text x="390" y="190" fill="#54d2e5" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" text-anchor="start">Conventional development</text><text x="820" y="190" fill="#54d2e5" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" text-anchor="start">AI-assisted development</text><text x="48" y="305" fill="#f3b85d" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start">Explicit</text><text x="48" y="343" fill="#f3b85d" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start">runtime rules</text><text x="48" y="545" fill="#f3b85d" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start">Consequential</text><text x="48" y="583" fill="#f3b85d" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start">model judgment</text><rect x="330" y="230" width="395" height="200" rx="16" fill="#15283d" stroke="#35516b" stroke-width="2"/><text x="356" y="310" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="start">Conventional</text><text x="356" y="348" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="start">application</text><rect x="760" y="230" width="395" height="200" rx="16" fill="#15283d" stroke="#35516b" stroke-width="2"/><text x="786" y="310" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="start">AI helps build</text><text x="786" y="348" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="start">the application</text><rect x="330" y="465" width="395" height="200" rx="16" fill="#15283d" stroke="#35516b" stroke-width="2"/><text x="356" y="545" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="start">Model-dependent product</text><text x="356" y="583" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="start">built conventionally</text><rect x="760" y="465" width="395" height="200" rx="16" fill="#15283d" stroke="#35516b" stroke-width="2"/><text x="786" y="545" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="start">AI helps build a</text><text x="786" y="583" fill="#eef5fc" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="start">model-dependent product</text><text x="330" y="725" fill="#a9bbce" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" text-anchor="start">A gain on one axis does not establish readiness on the other.</text><text x="48" y="772" fill="#a9bbce" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Vitalii Oborskyi  /  AI Changes Both Sides of Software Engineering</text></svg>