<main id="main" tabindex="-1" class="article-reader wrap" lang="{{LANGUAGE}}">
  <article aria-labelledby="{{TITLE_ID}}">
    <header class="article-intro">
      <p class="eyebrow">{{STATUS}}</p>
      <h1 id="{{TITLE_ID}}">{{TITLE}}</h1>
      <p class="article-summary">{{SUMMARY}}</p>
      <p>{{AUTHORS}}</p>
      <p><a href="writing.html">Back to Writing</a></p>
    </header>
    <nav class="article-toc" aria-label="Article contents">
      <h2>Contents</h2>
      <ol>
        {{TOC}}
      </ol>
    </nav>
    <div class="article-body">{{BODY}}</div>
    {{SOURCES}}
  </article>
</main>
