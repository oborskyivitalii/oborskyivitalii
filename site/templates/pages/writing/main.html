<main id="main" tabindex="-1"
  >{{BLOCK:section-1}}<p class="sr-only" data-writing-formula-description>{{TEXT:T001}}</p
  ><nav class="topic-nav wrap" data-archive-navigation aria-label="{{ATTRIBUTE:A001}}"
    >{{ARCHIVE_TOPIC_NAV}}</nav
  ><div class="wrap"
    ><nav class="section-nav" aria-label="{{ATTRIBUTE:A002}}" data-archive-navigation
      >{{ARCHIVE_YEAR_NAV}}</nav
    ><form id="archive-filters" class="archive-filters" hidden aria-label="{{ATTRIBUTE:A003}}"
      ><label
        >{{TEXT:T008}}<select id="archive-topic"
          ><option value="all">{{TEXT:T009}}</option
          >{{ARCHIVE_TOPIC_OPTIONS}}</select
        ></label
      ><label
        >{{TEXT:T014}}<select id="archive-year"
          ><option value="all">{{TEXT:T015}}</option
          >{{ARCHIVE_YEAR_OPTIONS}}</select
        ></label
      ><label
        >{{TEXT:T018}}<select id="archive-language"
          ><option value="all">{{TEXT:T019}}</option
          >{{ARCHIVE_LANGUAGE_OPTIONS}}</select
        ></label
      ><button type="reset" class="filter-reset">{{TEXT:T022}}</button></form
    ><div class="archive-landings" role="navigation" aria-label="{{ATTRIBUTE:A004}}"
      >{{ARCHIVE_TOPIC_LANDINGS}}</div
    ><h2 id="archive-heading" class="archive-heading" hidden>{{TEXT:T031}}</h2
    ><p
      id="archive-count"
      data-count="{{ATTRIBUTE:A005}}"
      data-print="{{ATTRIBUTE:A006}}"
      class="section-note"
      role="status"
      aria-live="polite"
      >{{CATALOG_PRIMARY_COUNT}}{{TEXT:T032}}</p
    ><p class="section-note">{{TEXT:T038}}</p
    ><p id="archive-empty" class="empty-state" hidden>{{TEXT:T039}}</p></div
  ><div id="archive-results" class="archive-results">{{ARCHIVE_RESULTS}}</div></main
>
