<section class="article-presentation" aria-label="Presentation">
  <p><strong>{{TITLE}}</strong></p>
  {{POSTER}}
  <p class="presentation-actions">
    <a href="{{PDF}}" class="presentation-toggle" aria-expanded="false">View slides here</a>
    <a href="{{PDF}}" target="_blank" rel="noopener">Open PDF</a>
    <a href="{{PDF}}" download>Download PDF</a>
  </p>
  <div class="presentation-viewer" hidden></div>
  <p class="presentation-help"
    >If your browser cannot show the slides here, open or download the PDF.</p
  >
</section>
