<!doctype html>
<html lang="{{language}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{summary}}" />
    <meta name="article-edition" content="{{edition}}" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="{{cssPath}}" />
  </head>
  <body class="{{documentClass}}">
    <main class="article-print">
      <header class="article-print-header">
        <h1 id="{{titleId}}">{{title}}</h1>
        {{subtitle}}
        <p class="article-print-authors">{{authors}}</p>
        <p class="article-print-summary">{{summary}}</p>
      </header>
      <nav class="article-print-toc" aria-label="Contents">
        <p class="article-print-toc-label">Contents</p>
        {{toc}}
        <div class="article-print-toc-appendices" {{appendicesAttributes}}>
          <p class="article-print-toc-label">Sources and publication record</p>
          {{appendicesToc}}
        </div>
      </nav>
      <article class="article-print-body">{{body}}</article>
    </main>
  </body>
</html>
