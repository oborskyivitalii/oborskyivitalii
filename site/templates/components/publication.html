<li class="publication" data-language="{{LANGUAGE}}" {{ARCHIVE_ATTRIBUTES}}
  ><div class="publication-meta"
    ><time datetime="{{DATE}}">{{DATE_LABEL}}</time
    ><span>{{LANGUAGE_BADGE}} · {{KIND}} · {{PUBLISHER}}</span></div
  ><div
    ><a class="publication-title" href="{{URL}}"
      >{{TITLE}}<span class="publication-arrow" aria-hidden="true">↗</span></a
    >{{EDITION_LINKS}}{{DISCUSSION_LINKS}}{{SUMMARY}}</div
  ></li
>
