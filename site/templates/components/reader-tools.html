<dialog class="reader-dialog reader-image-dialog" aria-label="Image viewer" hidden>
  <div class="reader-dialog-header">
    <h2>Image</h2>
    <button type="button" data-reader-close aria-label="Close image viewer">Close</button>
  </div>
  <div class="reader-image-stage" data-reader-image tabindex="0" aria-label="Image detail"></div>
  <p class="reader-image-caption" data-reader-image-caption></p>
  <div class="reader-dialog-actions">
    <button type="button" data-reader-zoom aria-pressed="false">Actual size</button>
    <a href="#main" data-reader-image-original>Open original image</a>
  </div>
</dialog>
<dialog class="reader-dialog reader-note-dialog" aria-label="Reference" hidden>
  <div class="reader-dialog-header">
    <h2 data-reader-note-title>Reference</h2>
    <button type="button" data-reader-close aria-label="Close reference">Close</button>
  </div>
  <div class="reader-note-body" data-reader-note-body></div>
  <div class="reader-dialog-actions">
    <a href="#main" data-reader-note-full>View in sources and references</a>
  </div>
</dialog>
