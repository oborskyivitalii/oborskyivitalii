<text x="1120" y="179.76" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#142632">ART DIRECTION</text>
<text x="1120" y="223.76" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142632">Asymmetric, faceted silhouette.</text>
<text x="1120" y="258.76" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142632">Cool planes + one warm accent.</text>
<text x="1120" y="293.76" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142632">No circular halo or orbit.</text>
<text x="1120" y="328.76" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142632">Keep the person still.</text>
<text x="1120" y="363.76" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142632">No mouse-driven camera.</text>
<polyline points="1120.00,401.00 1602.00,401.00" fill="none" stroke="#cdd6da" stroke-width="1"/>
<text x="1120" y="440.58" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#142632">Movement comes from reading:</text>
<text x="1120" y="476.94" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#142632">scroll + meaningful in-page navigation.</text>
<text x="1120" y="514.76" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#142632">One world. Several camera positions.</text>
