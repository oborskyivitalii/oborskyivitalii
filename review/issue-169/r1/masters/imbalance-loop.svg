<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-label="Conditional capacity-pressure and learning feedback loop"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#245866" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#fffdf7"/><rect x="35" y="20" width="270" height="70" rx="12" fill="#c1d4d2" stroke="#245866" stroke-width="2"/><text x="170.0" y="64.45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#172b36"><tspan x="170.0" dy="0">Faster generation</tspan></text><path d="M308 55 H352" fill="none" stroke="#245866" stroke-width="3" /><path d="M342.0,49.0 L352.0,55.0 L342.0,61.0" fill="none" stroke="#245866" stroke-width="3"/><rect x="358" y="20" width="270" height="70" rx="12" fill="#e8eeea" stroke="#ccd0c9" stroke-width="2"/><text x="493.0" y="64.1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#172b36"><tspan x="493.0" dy="0">Admission decision</tspan></text><path d="M630 55 H672" fill="none" stroke="#245866" stroke-width="3" /><path d="M662.0,49.0 L672.0,55.0 L662.0,61.0" fill="none" stroke="#245866" stroke-width="3"/><rect x="678" y="20" width="247" height="70" rx="12" fill="#fffdf7" stroke="#ccd0c9" stroke-width="2"/><text x="801.5" y="63.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#172b36"><tspan x="801.5" dy="0">Discard or defer</tspan></text><path d="M490 93 V136" fill="none" stroke="#245866" stroke-width="3" /><path d="M496.0,126.0 L490.0,136.0 L484.0,126.0" fill="none" stroke="#245866" stroke-width="3"/><text x="725" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#435962"><tspan x="725" dy="0">Only if obligations grow</tspan></text><rect x="490" y="145" width="435" height="84" rx="12" fill="#e8eeea" stroke="#ccd0c9" stroke-width="2"/><text x="707.5" y="180.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#172b36"><tspan x="707.5" dy="0">Demand exceeds verification</tspan><tspan x="707.5" dy="30.0">and ownership capacity</tspan></text><rect x="490" y="288" width="435" height="84" rx="12" fill="#e8eeea" stroke="#ccd0c9" stroke-width="2"/><text x="707.5" y="323.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#172b36"><tspan x="707.5" dy="0">Waiting, rework</tspan><tspan x="707.5" dy="32.4">and support load</tspan></text><rect x="35" y="288" width="390" height="84" rx="12" fill="#e8eeea" stroke="#ccd0c9" stroke-width="2"/><text x="230.0" y="323.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#172b36"><tspan x="230.0" dy="0">Less capacity for learning</tspan><tspan x="230.0" dy="30.0">and improvement</tspan></text><path d="M708 232 V282" fill="none" stroke="#245866" stroke-width="3" /><path d="M714.0,272.0 L708.0,282.0 L702.0,272.0" fill="none" stroke="#245866" stroke-width="3"/><path d="M485 330 H432" fill="none" stroke="#245866" stroke-width="3" /><path d="M442.0,336.0 L432.0,330.0 L442.0,324.0" fill="none" stroke="#245866" stroke-width="3"/><path d="M228 282 V188 H483" fill="none" stroke="#245866" stroke-width="3" /><path d="M473.0,182.0 L483.0,188.0 L473.0,194.0" fill="none" stroke="#245866" stroke-width="3"/><text x="221" y="171" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#927348"><tspan x="221" dy="0">Pressure can reinforce itself</tspan></text><line x1="35" y1="401" x2="925" y2="401" stroke="#ccd0c9" stroke-width="2"/><text x="480" y="437" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#245866"><tspan x="480" dy="0">Test ways to rebalance; do not assume collapse</tspan></text><text x="480" y="474" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" fill="#435962"><tspan x="480" dy="0">If capability and useful outcomes keep pace, this loop need not arise.</tspan></text></svg>