<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; script-src 'none'"
    />
    <title>The Sum of Our Technology</title>
    <style>
      :root {
  --scroll-entry-distance: 88px;
  --block-motion-duration: 700ms;
  --block-motion-phase: 1000ms;
  --block-motion-stagger: 80ms;
  --block-motion-easing: cubic-bezier(0.65, 0, 0.35, 1);
  --paper: #f3f1ea;
  --ink: #172b36;
  --muted: #435962;
  --line: #ccd0c9;
  --control-line: #6c807f;
  --accent: #245866;
  --systems: #70512d;
  --bronze: #927348;
  --air: #c1d4d2;
  --tint: #e8eeea;
  --scene-sheet: #fffdf7;
  --portrait-start: #deebeb;
  --portrait-end: #f4edde;
  --facet-1: #e7ece8;
  --facet-2: #dce9eb;
  --facet-3: #cddfe3;
  --facet-4: #eae1ce;
  --facet-5: #bfd4da;
  --facet-6: #eff0e9;
  --button-bg: #245866;
  --button-ink: #fffdf7;
  --sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  padding: 0;
}
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
}
.card {
  width: 1080px;
  height: 1350px;
  padding: 68px 76px 52px;
  display: flex;
  flex-direction: column;
  border-top: 18px solid var(--accent);
  background: var(--paper);
  break-after: page;
}
.card:last-child {
  break-after: auto;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 30px;
}
.author {
  font-size: 30px;
  font-weight: 700;
}
.edition {
  font-size: 20px;
  letter-spacing: 3px;
  text-transform: uppercase;
}
main {
  padding-top: 105px;
  flex: 1;
  min-height: 0;
}
.eyebrow {
  margin: 0 0 35px;
  color: var(--accent);
  font-size: 29px;
  font-weight: 700;
}
h1 {
  margin: 0 0 46px;
  max-height: 300px;
  font-size: 91px;
  line-height: 1.08;
  letter-spacing: -3px;
}
.event {
  max-height: 235px;
  margin: 0 0 35px;
  font-size: 55px;
  line-height: 1.15;
  font-weight: 700;
}
.support {
  max-height: 190px;
  margin: 0;
  font-size: 33px;
  line-height: 1.4;
}
footer {
  border-top: 2px solid var(--line);
  padding-top: 27px;
}
footer p {
  margin: 0;
}
.date {
  font-size: 42px;
  font-weight: 700;
}
.details {
  margin-top: 12px;
  font-size: 27px;
}
.destination {
  margin-top: 27px;
  font-size: 25px;
  color: var(--accent);
  overflow-wrap: anywhere;
}
.credit {
  margin-top: 14px;
  font-size: 18px;
  max-height: 55px;
}
.slide {
  display: none;
}
[data-template='slide'] main {
  padding-top: 55px;
}
[data-template='slide'] h1 {
  font-size: 57px;
  max-height: 135px;
  margin-bottom: 30px;
}
[data-template='slide'] .eyebrow {
  margin-bottom: 22px;
}
[data-template='slide'] .slide {
  display: flex;
  height: 455px;
  margin-bottom: 30px;
  background: var(--scene-sheet);
  align-items: center;
  justify-content: center;
}
.slide img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
[data-template='slide'] .event {
  font-size: 27px;
  margin-bottom: 17px;
}
[data-template='slide'] .support {
  font-size: 28px;
  max-height: 130px;
}
[data-template='reminder'] h1 {
  color: var(--accent);
}
p:empty {
  display: none;
}
[data-template='cover'] main,
[data-template='text'] main,
[data-template='numbers'] main,
[data-template='closing'] main {
  padding-top: 72px;
}
[data-template='cover'] .slide {
  display: flex;
  height: 290px;
  margin: 0 0 30px;
}
[data-template='cover'] h1 {
  font-size: 76px;
  max-height: 255px;
  margin-bottom: 35px;
}
[data-template='text'] h1,
[data-template='numbers'] h1,
[data-template='closing'] h1 {
  font-size: 80px;
}
[data-template='text'] .support,
[data-template='numbers'] .support,
[data-template='closing'] .support {
  max-height: 285px;
  font-size: 38px;
}
[data-template='cover'] .date,
[data-template='text'] .date,
[data-template='numbers'] .date,
[data-template='closing'] .date {
  font-size: 28px;
}
[data-template='cover'] .credit,
[data-template='text'] .credit,
[data-template='numbers'] .credit,
[data-template='closing'] .credit {
  font-size: 28px;
  line-height: 1.35;
  max-height: 96px;
}
.points {
  padding-left: 38px;
  margin: 35px 0 0;
  font-size: 38px;
  line-height: 1.35;
}
.points li + li {
  margin-top: 22px;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 50px;
}
.metric {
  padding: 24px 12px;
  border-top: 4px solid var(--accent);
}
.metric strong,
.metric span {
  display: block;
}
.metric strong {
  color: var(--accent);
  font-size: 85px;
  letter-spacing: -3px;
}
.metric span {
  font-size: 32px;
  line-height: 1.4;
  margin-top: 18px;
}
@page {
  size: 1080px 1350px;
  margin: 0;
}

    </style>
  </head>
