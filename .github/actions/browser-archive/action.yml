name: Restore pinned browser archive
description: Verify source-bound native artifacts without downloading from a browser CDN or launching a browser
inputs:
  browsers:
    description: Exact existing comma-separated engine selection
    required: true
  directory:
    description: Optional existing workflow browser-storage location
    required: false
    default: ''
  working-directory:
    description: Existing checkout directory when the job uses a nested checkout
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - name: Install the native archive reader without changing Linux Python tooling
      if: runner.os != 'Linux'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.13.17
    - name: Restore and verify exact browser bytes without prior launch
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        BROWSER_ARCHIVE_ENGINES: ${{ inputs.browsers }}
        BROWSER_ARCHIVE_DESTINATION: ${{ inputs.directory || format('{0}/browser-runtime', runner.temp) }}
        BROWSER_ARCHIVE_REPORT: ${{ runner.temp }}/browser-archive-report.json
      run: node tools/quality/browser-runtime.cjs restore --browsers "$BROWSER_ARCHIVE_ENGINES" --directory "$BROWSER_ARCHIVE_DESTINATION"
    - name: Identify this matrix cell's setup receipt
      id: receipt
      if: always()
      shell: bash
      run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'suffix=' + require('node:crypto').randomUUID() + '\n')"
    - name: Retain browser supply identity or setup failure
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: browser-setup-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.receipt.outputs.suffix }}
        path: ${{ runner.temp }}/browser-archive-report.json
        if-no-files-found: error
        retention-days: 90
