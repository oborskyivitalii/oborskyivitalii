name: One-shot PMDay R12 source synchronization
on:
  push:
    branches: [work/issue-5-publisher-pmday-20261012]
    paths: [.github/workflows/pmday-r12-source-sync-once.yml]
permissions:
  contents: write
concurrency:
  group: pmday-r12-editorial-source
  cancel-in-progress: false
jobs:
  synchronize:
    if: github.repository == 'oborskyivitalii/oborskyivitalii'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Install existing locked source-check toolchains
        run: |
          npm ci --prefix tools/publishing/toolchain --ignore-scripts
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          python3 -m venv tools/quality/toolchain/venv
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check --no-deps ruff==0.16.10 PyYAML==6.0.3
      - name: Transfer supplied R12 and explicitly defer the unavailable cover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.request

          root = Path.cwd()
          temporary = Path(os.environ['RUNNER_TEMP']) / 'pmday-r12-source'
          temporary.mkdir()
          repository = os.environ['GITHUB_REPOSITORY']
          supplied_blob = '81c3c8257cc73db0141fa7e7bae0485083a88543'
          request = urllib.request.Request(
              'https://api.github.com/repos/' + repository + '/git/blobs/' + supplied_blob,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          supplied = base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob ' + str(len(supplied)).encode() + b'\0' + supplied).hexdigest() == supplied_blob
          full_reader = supplied.decode('utf-8')
          assert full_reader.endswith('\n') and '\r' not in full_reader
          assert 'Editorial draft R12, 19 October 2026' in full_reader
          assert '<!--' not in full_reader and 'sandbox:' not in full_reader
          assert len(re.findall(r'^## [1-6]\.', full_reader, re.M)) == 6
          assert full_reader.split('## 4.')[1].split('## 5.')[0].count('**What if not?**') == 2
          assert full_reader.split('## 5.')[1].split('## 6.')[0].count('**What if not?**') == 6
          bibliography = full_reader.split('## Sources & references')[1].split('## How to cite')[0]
          assert [int(number) for number in re.findall(r'^(\d+)\. ', bibliography, re.M)] == list(range(1, 32))
          first_mentions = list(dict.fromkeys(re.findall(r'\[(\d+)\]', full_reader.split('## Sources & references')[0])))
          assert first_mentions == [str(number) for number in range(1, 32)]
          figures = re.findall(r'^!\[(.*?)\]\(asset:([a-z0-9-]+)\)$', full_reader, re.M)
          assert [key for alt, key in figures] == ['cover', 'pmday-slide-03', 'pmday-slide-05', 'pmday-slide-07', 'pmday-slide-09', 'pmday-slide-10', 'pmday-slide-12', 'pmday-slide-14']
          cover_line = '![A solitary person stands before a narrow opening of light between monumental dark walls.](asset:cover)\n\n'
          assert full_reader.count(cover_line) == 1
          # No article prose is rewritten. The unavailable cover furniture is omitted,
          # rather than rendering the previous bridge image under Cover02's description.
          reader = full_reader.replace(cover_line, '', 1)
          full_sha = hashlib.sha256(supplied).hexdigest()
          reader_sha = hashlib.sha256(reader.encode()).hexdigest()
          omission = 'Author selected Cover02, already present in the standalone compact R12 PDF. Its PNG bytes are not yet imported into the repository; do not substitute the old bridge illustration. Restore the selected asset through a new media/semantic edition before hosted publication.'

          directory = root / 'site/publications/pmday-ai-both-sides'
          metadata_file = directory / 'publication.json'
          metadata = json.loads(metadata_file.read_text())
          assert metadata['edition'] == 'pmday-ai-both-sides-en-review-20261018-r10'
          assert metadata['status'] == 'review' and metadata['canonical'] is None
          original_slides = {}
          for asset in metadata['assets']:
              actual = hashlib.sha256((root / asset['path']).read_bytes()).hexdigest()
              assert actual == asset['sha256'], asset['id']
              if asset['id'].startswith('pmday-slide-'):
                  original_slides[asset['id']] = actual
          assert len(original_slides) == 7
          metadata['assets'] = [asset for asset in metadata['assets'] if asset['id'] != 'cover']
          for asset in metadata['assets']:
              if asset['id'] == 'pmday-slide-03':
                  asset['caption'] = 'Synthetic fixed-capacity illustration. Uncontrolled intake accumulates work; controlled intake bounds the queue without proportionally increasing delivery. Both regimes are explained in the text. PMDay 2026 · slide 3 · Vitalii Oborskyi. [1]'
          metadata['edition'] = 'pmday-ai-both-sides-en-review-20261019-r12'
          metadata['rights']['notice'] = 'Article by Vitalii Oborskyi and seven unchanged full-page PMDay v35 slides. Cover02 selected for the standalone PDF; repository image import pending. Original deck/source/third-party credits retained; exact-edition publication clearance pending.'
          metadata_file.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n')
          (directory / 'manuscript.en.md').write_text(reader)
          profile_file = directory / 'profile.json'
          profile = json.loads(profile_file.read_text())
          profile['id'] = 'pmday-ai-both-sides-review-20261019-r12'
          profile['assets']['cover'] = {'omitReason': omission}
          profile['assets']['hero'] = {'omitReason': omission}
          profile_file.write_text(json.dumps(profile, ensure_ascii=False, indent=2) + '\n')

          draft_header = '> **Editorial R12 — 19 October 2026. Review source, not a public edition.**\n> Transferred from the delivered `The_Sum_of_Our_Technology_R12.md` under article issue #2 / PR #79, execution #5. The reader below retains the entire supplied R12, including its intended Cover02 marker. No additional editorial rewrite.\n> Supplied reader Git blob: `' + supplied_blob + '`; SHA-256: `' + full_sha + '`. Canonical manuscript prose and references are identical; the sole rendition delta omits the unresolved cover image line. The existing profile explicitly records that omission instead of displaying the wrong image.\n\n<!-- ARTICLE START -->\n\n'
          tail = '''
          <!-- ARTICLE END -->

          ## R12 source and assembly contract — not reader prose

          Preserve the supplied reader, six chapters, two chapter-4 and six chapter-5 What if not turns, 31 references in first-mention order, the systemic-engineering conclusion and the compressed rhythm. This includes scrutiny of the actual baseline, NBER/DORA before the synthetic queue, hostile-retrieval scenario, concrete human and recovery checks, explicit Thinking System definition, and attributed Lem quotations in chapters 1 and 6.

          All seven source slides remain byte-unchanged in order 3/5/7/9/10/12/14. Publication metadata owns their paths, alt/captions, credits and reference bindings. Slide 10's all-failure interval is distinct from the text's one-disclosure critical class. Do not redraw the original slides or weaken source qualifications.

          Cover02 remains selected. The earlier bridge picture must not be reused under the new cover description. The compact R12 PDF already delivered in the conversation includes the correct cover; its original PNG/adaptation archive is not yet imported. The supplied reader block retains the intended cover marker. The canonical manuscript currently differs ONLY by omitting that cover-image line and its following blank line, while the profile records explicit cover and hero omission reasons. This is a blocked visual integration, not author approval to publish without the cover. All prose, punctuation, bibliography and citation wording remain identical.

          Source-only transfer does not regenerate the PDF, platform packages, public catalog, stable staging or production. Older editions and the r2 PDF/kit are historical. A future selected-cover import must create a new media/semantic edition and reconcile metadata/profile roles before hosted visual and rights review. It must not overwrite the frozen R12 source record.

          Existing technical reconciliation, resource limits, runtime, templates and publishing code remain unchanged. Keep the PR Draft. Source checks are not independent editorial/scientific/rights or publication acceptance. Read the latest issue-2 candidate README for exact source results and remaining work.
          '''.replace('\n          ', '\n').lstrip()
          (root / 'drafts/pmday-article-draft.en.md').write_text(draft_header + full_reader + '\n' + tail)
          (directory / 'blueprint.md').write_text('# The Sum of Our Technology — R12 source review\n\nArticle owner #2; publisher/execution #5 / PR79.\n\nUse the supplied R12, retaining six chapters, evidence-first flow, real-baseline comparison, adversarial-retrieval case, finite human capacity, both Lem placements, 31 numbered references and the systemic-engineering conclusion. No further rewriting was requested.\n\nThe editorial draft retains the exact input. Canonical prose is identical; only the Cover02 image marker is omitted until real selected bytes can be imported. Existing profile omission reasons make the pending artwork explicit and prevent the obsolete bridge illustration appearing under its new description. All seven original slide PNGs and previous edition records remain unchanged.\n\nThis is a review source, not a published article or accepted hosted rendition. Rights, image import, hosted reading, technical resource gates, production and upstream decisions remain separate.\n')
          catalog_file = root / '.github/repository-paths.json'
          catalog = json.loads(catalog_file.read_text())
          edition_path = 'site/publications/pmday-ai-both-sides/editions/' + metadata['edition'] + '.json'
          assert edition_path not in catalog['entries']
          catalog['entries'][edition_path] = {'kind': 'file', 'purpose': 'R12 source review edition; supplied prose and 31 sources, with selected Cover02 image import explicitly pending.', 'role': 'source', 'owner': 'guides/ARTICLE-WORKFLOW.md'}
          catalog['entries'] = dict(sorted(catalog['entries'].items()))
          catalog_file.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n')

          run_url = 'https://github.com/' + repository + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          report = {'suppliedReaderBlob': supplied_blob, 'suppliedReaderSha256': full_sha, 'canonicalReaderSha256': reader_sha, 'renditionDelta': 'Only the unavailable Cover02 image marker and following blank line are omitted from canonical; all article prose and references unchanged.', 'bibliographyCount': 31, 'originalSlideSha256': original_slides, 'coverImport': 'PENDING: local runtime unavailable; supplied public R11 PDF URL returned HTTP 403. No PNGs substituted or fabricated.', 'preparationRun': run_url}
          (temporary / 'source-checks.json').write_text(json.dumps(report, indent=2) + '\n')
          review = root / 'review/issue-2/pmday-candidate-20261015/README.md'
          previous = review.read_text()
          review.write_text('# PMDay article: current R12 source and retained history\n\n## Editorial R12 — 19 October 2026 source synchronization\n\nThe author requested the R12 Markdown be transferred to this PR. This is a source update, not another rewrite or release. Full input is preserved in the editorial draft; canonical prose, punctuation, bibliography and citation wording are the same. The only deliberate rendition delta omits the cover-image marker until the selected image bytes can be imported.\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n\n### Implemented changes and preserved boundaries\n\nR11 compression/systemic conclusion and R12 baseline symmetry, evidence-first SDLC structure, hypothetical prompt injection, operational human/recovery checks, clear Thinking System definition, Lem at beginning/end and 31 first-mention references are retained. Two chapter-4 and six chapter-5 refrains remain. Seven source slides remain byte-unchanged; figure-1 caption now matches the before-slide controlled-intake explanation.\n\nThe supplied 15-page R12 Cover02 PDF is the prior conversation deliverable; it was not regenerated here and is not the old r2 article.pdf/kit retained in this directory. No new local PDF hash/visual inspection is claimed. Cover02 import remains OPEN: the local execution service failed, the previously supplied public PDF link returned 403, and the prior asset archive could not be converted into a connector upload reference. The old artwork files are preserved as history but removed from active selection. Both profile roles have explicit omission reasons; publishing without the selected cover is not approved. A future real-byte import requires a new semantic/media edition.\n\n### Checks and acceptance\n\nThe preparation run above records actual source checks: reader structure and first-occurrence citations, locked-AST reference extraction, article validation, scoped formatting, Basic, RI build/verify and RI/CI tests, and final prose parity. The first preparation run39205389704 failed on HTTP403 before installing any article source; it remains failed. No source/hosted/rights check is weakened to make it pass. Existing technical HTML-budget/notices blockers remain separate from this source checkpoint.\n\nApplicable CS01/02/04/05/08/10: canonical content and metadata owners, explicit profile omission, scoped mechanical formatting, source/figure checks and honest issue evidence. No publishing-engine/runtime/template/test-budget changes. #2 AC01–AC06 and applicable #5 independent/hosted/publication gates stay open. No merge, production, stable promotion or external posting.\n\n## Historical checkpoints (not current acceptance)\n\n' + previous)
          memory = root / 'MEMORY.md'
          text = memory.read_text()
          text = text.replace('Last verified: **2026-10-18**.', 'Last verified: **2026-10-19** for R12 source; technical observations retain their dates.')
          text = text.replace('- Current R10 manuscript SHA256:\n  5f86917f65c51c7cf77164d9dd801c05e92d84353b96496bab458f38fd8f7b49.', '- Current R12 canonical source SHA256: ' + reader_sha + '.\n  Exact supplied R12 is in drafts; canonical differs only by the cover marker.\n  Cover02 PNG import is pending; old illustration is not selected.\n  Evidence: review/issue-2/pmday-candidate-20261015/README.md.')
          text = text.replace('  Article writing/editing is explicitly excluded; it continues in another chat.', '  That technical step excluded writing. R12 was separately authorized\n  in the editorial conversation and is now the current article input.')
          text = text.replace('  this chat does not write or accept the article.', '  transferring source does not accept or publish the article.')
          assert len(text.splitlines()) <= 120
          memory.write_text(text)
          print(json.dumps(report, indent=2))
          PY
      - name: Derive reference inventory and freeze the new source edition
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const directory = 'site/publications/pmday-ai-both-sides/';
          const reader = fs.readFileSync(directory + 'manuscript.en.md', 'utf8');
          const metadata = JSON.parse(fs.readFileSync(directory + 'publication.json', 'utf8'));
          const assets = metadata.assets.map((asset) => ({ ...asset, url: '/' + asset.path.slice(5) }));
          const compiled = require('./tools/publishing/article.cjs').compile(reader, assets, { title: metadata.title });
          const urls = [...new Set(compiled.model.links.map((link) => link.url).filter((url) => url.startsWith('https:')))];
          if (urls.length !== 36 || compiled.model.figures.length !== 7) throw Error('Unexpected R12 citation or source-slide count');
          if (compiled.model.links.filter((link) => link.url === metadata.presentation.sourceUrl).length !== 1) throw Error('Presentation link must occur exactly once');
          metadata.references = urls.map((url, index) => ({ id: 'source-' + (index + 1), url }));
          fs.writeFileSync(directory + 'publication.json', JSON.stringify(metadata, null, 2) + '\n');
          const source = { path: 'manuscript.en.md', sha256: crypto.createHash('sha256').update(reader).digest('hex'), commit: null, blob: null };
          const edition = { schema: 1, id: metadata.edition, articleId: metadata.id, language: metadata.language, kind: 'full-article', source, owner: 'site', derivation: null, rights: 'review-pending', semanticSha256: require('./tools/publishing/semantic.cjs').semanticDigest(metadata, source) };
          fs.writeFileSync(directory + 'editions/' + edition.id + '.json', JSON.stringify(edition, null, 2) + '\n', { flag: 'wx' });
          console.log(JSON.stringify({ edition: edition.id, semanticSha256: edition.semanticSha256, references: urls.length, cover: 'explicitly pending' }));
          NODE
      - name: Remove temporary workflow and stage only article source owners
        run: |
          git rm .github/workflows/pmday-r12-source-sync-once.yml
          git add drafts/pmday-article-draft.en.md site/publications/pmday-ai-both-sides/
          git add .github/repository-paths.json MEMORY.md review/issue-2/pmday-candidate-20261015/README.md
      - name: Apply exact formatter settings to scoped JSON
        run: |
          tools/quality/toolchain/node_modules/.bin/prettier --config tools/quality/prettier.config.json --write .github/repository-paths.json site/publications/pmday-ai-both-sides/publication.json site/publications/pmday-ai-both-sides/profile.json site/publications/pmday-ai-both-sides/editions/pmday-ai-both-sides-en-review-20261019-r12.json
          git add .github/repository-paths.json site/publications/pmday-ai-both-sides/
          node tools/quality/format.cjs --check
      - name: Validate R12 with the existing publisher
        run: node tools/publishing/cli.cjs validate pmday-ai-both-sides
      - name: Refresh and verify existing RI and CI routes
        run: |
          python3 tools/check_ri_ci.py refresh
          python3 tools/check_ri_ci.py verify
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json build
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json verify
          python3 -m unittest discover -s tests -p 'test_repository_intelligence.py'
          python3 -m unittest discover -s tests -p 'test_ri_ci.py'
      - name: Existing Basic source checks
        run: node tools/quality/local.cjs
      - name: Verify text parity and unchanged technical source before committing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess
          root = Path.cwd()
          draft = (root / 'drafts/pmday-article-draft.en.md').read_text()
          full_reader = draft.split('<!-- ARTICLE START -->')[1].split('<!-- ARTICLE END -->')[0].strip() + '\n'
          original = full_reader.encode()
          assert hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest() == '81c3c8257cc73db0141fa7e7bae0485083a88543'
          expected = full_reader.replace('![A solitary person stands before a narrow opening of light between monumental dark walls.](asset:cover)\n\n', '', 1)
          canonical = (root / 'site/publications/pmday-ai-both-sides/manuscript.en.md').read_text()
          assert expected == canonical
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pmday-r12-source/source-checks.json').read_text())
          metadata = json.loads((root / 'site/publications/pmday-ai-both-sides/publication.json').read_text())
          for asset in metadata['assets']:
              if asset['id'] in report['originalSlideSha256']:
                  assert hashlib.sha256((root / asset['path']).read_bytes()).hexdigest() == report['originalSlideSha256'][asset['id']]
          allowed = ['drafts/pmday-article-draft.en.md', 'site/publications/pmday-ai-both-sides/', '.github/repository-paths.json', '.github/repository-intelligence/', '.github/ri-ci-map.json', 'REPOSITORY-MAP.md', 'MEMORY.md', 'review/issue-2/pmday-candidate-20261015/README.md', '.github/workflows/pmday-r12-source-sync-once.yml']
          changed = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines()
          assert all(any(name == prefix or name.startswith(prefix) for prefix in allowed) for name in changed), changed
          print(json.dumps({'proseParity': True, 'coverDeltaExplicit': True, 'changed': changed}))
          PY
          git add .github/ri-ci-map.json .github/repository-intelligence/ REPOSITORY-MAP.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content(article): synchronize R12 prose and sources with explicit cover follow-up (Refs #5)'
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/work/issue-5-publisher-pmday-20261012 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:work/issue-5-publisher-pmday-20261012
