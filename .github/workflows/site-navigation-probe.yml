name: Site navigation diagnostic
run-name: Issue 189 native Home to Writing pair
# One-shot diagnostic branch. The workflow on main retains its own behavior.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact coherent workflow/script/candidate commit to diagnose
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: issue189-writing-pair
  cancel-in-progress: false
jobs:
  chromium:
    if: >-
      github.repository == 'oborskyivitalii/oborskyivitalii' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.run_attempt == '1' &&
      github.ref == 'refs/heads/work/issue189-writing-pair-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DIAGNOSTIC_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify diagnostic source
        run: |
          test "$DIAGNOSTIC_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Prepare bounded Ubuntu downloads
        run: sudo python3 tools/quality/ubuntu_downloads.py
      - name: Install locked Chromium tooling
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          tools/quality/toolchain/node_modules/.bin/playwright install-deps chromium
      - name: Restore verified pinned Chromium
        uses: ./.github/actions/browser-archive
        with:
          browsers: chromium
      - name: Measure one cold and warm Home to Writing pair
        env:
          SITE_REPORT_DIR: ${{ runner.temp }}/writing-pair
        run: node tools/quality/issue189-writing-pair.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: issue189-writing-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/writing-pair/
          if-no-files-found: error
          retention-days: 90
