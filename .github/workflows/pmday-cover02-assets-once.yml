name: One-shot R12 Cover02 asset import
on:
  push:
    branches: [work/issue-5-publisher-pmday-20261012]
    paths: [.github/workflows/pmday-cover02-assets-once.yml]
permissions:
  contents: write
concurrency:
  group: pmday-cover02-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'oborskyivitalii/oborskyivitalii'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Acquire the exact author-supplied media before its file-scoped URL expires
        env:
          IMPORT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-4398-8210-a16f-dcfaa853ee03/raw?se=2026-10-19T07%3A53%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=b2959818-aee9-5751-a9cb-7a797ae7f62a&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-19T04%3A55%3A19Z&ske=2026-10-20T04%3A55%3A19Z&sks=b&skv=2026-02-06&sig=JWS29qcSmEzP2NlmBBWoAC8Fa3cvzAC33%2BCOFXoo7%2Bs%3D'
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request, zipfile
          url = os.environ['IMPORT_URL']
          print('::add-mask::' + url)
          data = urllib.request.urlopen(url, timeout=90).read(12000000)
          assert len(data) == 11226657
          assert hashlib.sha256(data).hexdigest() == '7a2d9f39b3e6161f671112c3198ef82ac348cc8eb566a07c57ae6d0c3dc4ce18'
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          archive = temp / 'cover02-import.zip'
          archive.write_bytes(data)
          destination = temp / 'cover02-import'
          destination.mkdir()
          with zipfile.ZipFile(archive) as zipped:
              for member in zipped.infolist():
                  assert not pathlib.PurePosixPath(member.filename).is_absolute()
                  assert '..' not in pathlib.PurePosixPath(member.filename).parts
                  assert (member.external_attr >> 16) & 0o170000 != 0o120000
              zipped.extractall(destination)
          print('Verified complete media payload and source-import scripts.')
          PY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Install existing locked source-check toolchains
        run: |
          npm ci --prefix tools/publishing/toolchain --ignore-scripts
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          python3 -m venv tools/quality/toolchain/venv
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check --no-deps ruff==0.16.10 PyYAML==6.0.3
      - name: Import exact images and PDF without rewriting R12 prose
        run: |
          python3 "$RUNNER_TEMP/cover02-import/import.py"
          node "$RUNNER_TEMP/cover02-import/freeze.cjs"
      - name: Remove importer and stage only the authorized owners
        run: |
          git rm .github/workflows/pmday-cover02-assets-once.yml
          git add site/assets/publications/pmday-ai-both-sides/cover02/
          git add site/assets/publications/pmday-ai-both-sides/PROVENANCE.md
          git add site/publications/pmday-ai-both-sides/
          git add drafts/pmday-article-draft.en.md
          git add review/issue-2/pmday-candidate-20261015/
          git add MEMORY.md .github/repository-paths.json
      - name: Format only affected JSON using the repository configuration
        run: |
          tools/quality/toolchain/node_modules/.bin/prettier --config tools/quality/prettier.config.json --write .github/repository-paths.json site/publications/pmday-ai-both-sides/publication.json site/publications/pmday-ai-both-sides/profile.json site/publications/pmday-ai-both-sides/editions/pmday-ai-both-sides-en-review-20261019-r12-cover02.json site/assets/publications/pmday-ai-both-sides/cover02/manifest.json review/issue-2/pmday-candidate-20261015/r12-cover02-import.json
      - name: Refresh derived navigation without changing the CI policy
        run: |
          python3 tools/check_ri_ci.py refresh
          tools/quality/toolchain/node_modules/.bin/prettier --config tools/quality/prettier.config.json --write .github/ri-ci-map.json
          python3 tools/check_ri_ci.py verify
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json build
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json verify
      - name: Commit locally after verifying the scoped diff
        run: |
          git add .github/repository-paths.json .github/ri-ci-map.json .github/repository-intelligence/ REPOSITORY-MAP.md
          git add site/publications/pmday-ai-both-sides/ site/assets/publications/pmday-ai-both-sides/cover02/ review/issue-2/pmday-candidate-20261015/
          test -z "$(git diff --name-only HEAD -- tools site/engine site/scenes site/templates site/content tests)"
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content(article): complete Cover02 import and retain exact R12 review PDF (Refs #5)'
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/cover02-checked-source.txt"
      - name: Validate the exact clean source and existing Basic checks
        run: |
          node tools/publishing/cli.cjs validate pmday-ai-both-sides
          node tools/quality/format.cjs --check
          node tools/quality/local.cjs
          python3 tools/check_code_style.py
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json verify
          python3 tools/check_ri_ci.py verify
          python3 -m unittest discover -s tests -p 'test_repository_intelligence.py'
          python3 -m unittest discover -s tests -p 'test_ri_ci.py'
          test -z "$(git status --porcelain)"
      - name: Verify final text and non-force push to the existing PR
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('site/publications/pmday-ai-both-sides/manuscript.en.md')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '5258aa9e232fb082f4c34353fb0c31601cf092dde15b977d1bdfe2d890e3364b'
          draft = pathlib.Path('drafts/pmday-article-draft.en.md').read_text()
          reader = draft.split('<!-- ARTICLE START -->')[1].split('<!-- ARTICLE END -->')[0].strip() + '\n'
          assert reader.encode() == p.read_bytes()
          pdf = pathlib.Path('review/issue-2/pmday-candidate-20261015/The_Sum_of_Our_Technology_R12_Cover02_Compact.pdf')
          assert hashlib.sha256(pdf.read_bytes()).hexdigest() == 'aa6ef80d0a7f02ce9355df91137737e106b0493078d69ffd1bf12a3ed47eca01'
          PY
          remote_head=$(git ls-remote origin refs/heads/work/issue-5-publisher-pmday-20261012 | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:work/issue-5-publisher-pmday-20261012
      - name: Retain exact imported inputs and checked source identity
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pmday-cover02-import-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cover02-import.zip
            ${{ runner.temp }}/cover02-checked-source.txt
            review/issue-2/pmday-candidate-20261015/r12-cover02-import.json
          if-no-files-found: warn
          retention-days: 30
