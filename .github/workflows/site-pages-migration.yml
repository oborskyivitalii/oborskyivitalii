name: Authorized Pages canonical-root migration
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare before binding, execute after canonical binding, recover after restoring captured settings
        required: true
        type: choice
        options: [prepare, execute, recover]
      preparation_run:
        description: Successful preparation run ID (execute/recover)
        type: string
      preparation_attempt:
        description: Exact successful preparation attempt (execute/recover)
        type: string
      failed_execution_run:
        description: Failed or cancelled execution run ID (recover only)
        type: string
      failed_execution_attempt:
        description: Exact failed execution attempt (recover only)
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: author-pages-publication
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prepare:
    name: Pages migration preparation
    if: github.event.inputs.mode == 'prepare' && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - id: previous
        name: Authenticate old origin, accepted publisher and captured Pages settings
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const migration = require('./tools/pages/migration.cjs');
            const main = (await github.rest.repos.getBranch({...context.repo, branch: 'main'})).data;
            const pages = (await github.rest.repos.getPages(context.repo)).data;
            const plan = await migration.prepare(github, context, main, pages);
            require('node:fs').writeFileSync('migration-plan.json', JSON.stringify(plan, null, 2) + '\n');
            core.setOutput('id', plan.previous.artifactId);
            core.setOutput('digest', plan.previous.uploadDigest);
      - name: Download and authenticate original recovery ZIP before extraction
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_ID: ${{ steps.previous.outputs.id }}
          PREVIOUS_DIGEST: ${{ steps.previous.outputs.digest }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREVIOUS_ID/zip" > previous-upload.zip
          python3 tools/pages/unpack.py previous-upload.zip previous-download "$PREVIOUS_DIGEST"
      - name: Retain exact predecessor bytes and verify the still-original host
        run: |
          node - <<'JS'
          const migration = require('./tools/pages/migration.cjs');
          migration.freeze('previous-download/pages-package', 'previous-upload.zip',
            require('./migration-plan.json'), 'migration').catch(error => {
            console.error(error.message); process.exitCode = 1;
          });
          JS
      - name: Retain authenticated migration and settings recovery before any domain change
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-pages-migration-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: migration/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  publish:
    name: Pages publication
    if: github.event.inputs.mode != 'prepare' && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      MIGRATION_MODE: ${{ inputs.mode }}
      PREPARATION_RUN: ${{ inputs.preparation_run }}
      PREPARATION_ATTEMPT: ${{ inputs.preparation_attempt }}
      FAILED_EXECUTION_RUN: ${{ inputs.failed_execution_run }}
      FAILED_EXECUTION_ATTEMPT: ${{ inputs.failed_execution_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - id: preparation
        name: Authenticate exact successful owner-main preparation run and ZIP identity
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const proof = await require('./tools/pages/migration.cjs').preparation(
              github, context, process.env.PREPARATION_RUN, process.env.PREPARATION_ATTEMPT);
            for (const [key, value] of Object.entries(proof)) core.setOutput(key, value);
      - name: Download and authenticate frozen preparation before extraction
        env:
          PREPARATION_ID: ${{ steps.preparation.outputs.artifactId }}
          PREPARATION_DIGEST: ${{ steps.preparation.outputs.uploadDigest }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREPARATION_ID/zip" > preparation-upload.zip
          python3 tools/pages/unpack.py preparation-upload.zip prepared "$PREPARATION_DIGEST"
      - id: source
        name: Check exact settings, source bytes and production lease
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs = require('node:fs'), migration = require('./tools/pages/migration.cjs');
            const plan = migration.load('prepared');
            require('node:assert/strict').deepEqual(plan.preparation, {
              runId: Number(process.env.PREPARATION_RUN), attempt: Number(process.env.PREPARATION_ATTEMPT)
            });
            await migration.lease(github, context, plan, process.env.MIGRATION_MODE);
            const observation = process.env.MIGRATION_MODE === 'execute'
              ? await migration.observeSource('prepared')
              : await migration.recoverySource(github, context, 'prepared',
                process.env.FAILED_EXECUTION_RUN, process.env.FAILED_EXECUTION_ATTEMPT);
            fs.mkdirSync('pages-reports', {recursive: true});
            fs.writeFileSync('pages-reports/source.json', JSON.stringify(observation, null, 2) + '\n');
            core.setOutput('base', process.env.MIGRATION_MODE === 'execute' ? plan.to : plan.from);
      - name: Compose root migration or the unchanged captured recovery package
        run: |
          node - <<'JS'
          const fs = require('node:fs'), migration = require('./tools/pages/migration.cjs');
          if (process.env.MIGRATION_MODE === 'execute') {
            migration.compose('prepared', 'composed', {kind: 'ci-pages',
              runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
              controller: process.env.GITHUB_SHA});
            fs.cpSync('composed/pages-package', 'pages-package', {recursive: true});
            fs.cpSync('composed/staging-source', 'staging-source', {recursive: true});
          } else {
            fs.cpSync('prepared/previous/pages-package', 'pages-package', {recursive: true});
            require('./tools/pages/controller.cjs').stagingFromPages('pages-package', 'staging-source');
          }
          JS
      - name: Retain complete proposed package before publication
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pages-package/
            pages-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Install hosted staging navigation smoke
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          tools/quality/toolchain/node_modules/.bin/playwright install-deps chromium
      - name: Restore verified pinned browsers without prior launch
        uses: ./.github/actions/browser-archive
        with:
          browsers: chromium
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: pages-package/public
      - name: Recheck serialized source and controller lease immediately before deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const migration = require('./tools/pages/migration.cjs');
            await migration.lease(github, context, migration.load('prepared'), process.env.MIGRATION_MODE);
            if (process.env.MIGRATION_MODE === 'execute') await migration.observeSource('prepared');
            else await migration.recoverySource(github, context, 'prepared',
              process.env.FAILED_EXECUTION_RUN, process.env.FAILED_EXECUTION_ATTEMPT);
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - id: http
        name: Verify exact new or restored origin, root, staging, receipt and real 404
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          PAGES_BASE: ${{ steps.source.outputs.base }}
        run: node tools/pages/http.cjs pages-package "$PAGES_BASE" pages-reports/http.json
      - id: browser
        name: Verify actual staged navigation at the new or restored path
        if: steps.http.outcome == 'success'
        continue-on-error: true
        env:
          SITE_TEST_BASE_URL: ${{ steps.source.outputs.base }}/staging/
          SITE_TEST_PROFILE: staging
          SITE_PUBLIC_DIR: ${{ github.workspace }}/staging-source/public
          SITE_ARTIFACT_MANIFEST: ${{ github.workspace }}/staging-source/artifact.json
          SITE_REPORT_DIR: ${{ github.workspace }}/pages-reports
        run: node tools/quality/local-browser.cjs --smoke
      - name: Record exact manual settings recovery and authenticated package restore route
        if: always()
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          fs.mkdirSync('pages-reports', {recursive: true});
          const plan = fs.existsSync('prepared/migration.json') ? require('./prepared/migration.json') : null;
          const record = {schema: 1, kind: 'pages-migration-recovery-instruction',
            preparationRun: process.env.PREPARATION_RUN,
            preparationAttempt: process.env.PREPARATION_ATTEMPT,
            failedExecutionRun: process.env.GITHUB_RUN_ID,
            failedExecutionAttempt: process.env.GITHUB_RUN_ATTEMPT,
            capturedSettings: plan?.settings || null,
            action: 'Owner restores captured Pages settings; then dispatch recover with these exact run attempts. DNS restoration is external. Failed execution remains failed.'};
          fs.writeFileSync('pages-reports/recovery-instruction.json', JSON.stringify(record, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'Preparation: ' + record.preparationRun + '/' + record.preparationAttempt + '\n\n' +
            record.action + '\n\nCaptured settings: ' + JSON.stringify(record.capturedSettings) + '\n');
          JS
      - id: observations
        name: Retain all migration or recovery observations
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-pages-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-reports/
          if-no-files-found: error
          retention-days: 90
      - name: Keep failed migration or recovery red
        if: always() && (steps.deploy.outcome != 'success' || steps.http.outcome != 'success' || steps.browser.outcome != 'success' || steps.observations.outcome != 'success')
        run: exit 1
