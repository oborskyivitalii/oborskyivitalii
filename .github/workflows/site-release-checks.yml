name: Site release checks
on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      validation_level:
        description: Distinct validation contract; staging never substitutes for production
        type: string
        default: production
      full:
        type: boolean
        default: true
      base_url:
        description: Exact deployed HTTPS version URL; empty for pre-release checks
        type: string
        default: ''
      profile:
        type: string
        default: release
      automated_only:
        description: Full hosted automation; separate from physical/review acceptance
        type: boolean
        default: false
      public_artifact_id:
        description: Reuse the immutable basic-build artifact without rebuilding
        type: string
        default: ''
      public_run_id:
        description: Run owning the immutable public artifact
        type: string
        default: ''
      public_digest:
        type: string
        default: ''
      public_variant:
        description: Explicit public rendition; Color is staging-only
        type: string
        default: base
      public_upload_digest:
        type: string
        default: ''
      evidence_artifact_id:
        description: Immutable external review/device evidence artifact ID
        type: string
        default: ''
      evidence_run_id:
        description: Run that uploaded the external evidence in this repository
        type: string
        default: ''
    outputs:
      artifact_id:
        description: Immutable tested public artifact ID
        value: ${{ jobs.build.outputs.artifact_id }}
      artifact_upload_digest:
        description: GitHub upload archive SHA256
        value: ${{ jobs.build.outputs.artifact_upload_digest }}
      public_digest:
        description: Deterministic public file manifest digest
        value: ${{ jobs.build.outputs.public_digest }}
      gate_artifact_id:
        description: Immutable successful PR aggregate manifest artifact
        value: ${{ jobs.gate.outputs.artifact_id }}
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character source commit
        required: true
        type: string
      validation_level:
        description: Distinct validation contract; staging never substitutes for production
        type: string
        default: production
      full:
        description: Native platforms, performance, devices and review release gates
        type: boolean
        default: true
      base_url:
        description: Exact deployed HTTPS version URL; empty for pre-release checks
        type: string
        default: ''
      profile:
        type: string
        default: release
      automated_only:
        description: Full hosted automation; separate from physical/review acceptance
        type: boolean
        default: false
      public_artifact_id:
        description: Reuse the immutable basic-build artifact without rebuilding
        type: string
        default: ''
      public_run_id:
        description: Run owning the immutable public artifact
        type: string
        default: ''
      public_digest:
        type: string
        default: ''
      public_variant:
        description: Explicit public rendition; Color is staging-only
        type: string
        default: base
      public_upload_digest:
        type: string
        default: ''
      evidence_artifact_id:
        description: External review/device evidence artifact ID, when available
        type: string
        default: ''
      evidence_run_id:
        description: External evidence upload run ID in this repository
        type: string
        default: ''
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  SITE_VALIDATION_LEVEL: ${{ inputs.validation_level }}
  SITE_FULL: ${{ inputs.full }}
  SITE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  SITE_TEST_BASE_URL: ${{ inputs.base_url }}
  SITE_TEST_PROFILE: ${{ inputs.profile }}
  SITE_AUTOMATED_ONLY: ${{ inputs.automated_only }}
  SITE_PUBLIC_VARIANT: ${{ inputs.public_variant }}
  SITE_PUBLIC_DIR: ${{ github.workspace }}/quality-artifact/public
  SITE_ARTIFACT_MANIFEST: ${{ github.workspace }}/quality-artifact/artifact.json
  SITE_REPORT_DIR: ${{ github.workspace }}/quality-reports
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ inputs.public_artifact_id || steps.upload.outputs.artifact-id }}
      artifact_upload_digest: ${{ inputs.public_upload_digest || steps.upload.outputs.artifact-digest }}
      public_digest: ${{ steps.identity.outputs.digest }}
      artifact_run_id: ${{ inputs.public_run_id || github.run_id }}
      source_checks: ${{ steps.source_checks.outcome }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          # SEO reconciliation reads the immutable pre-redesign source edition.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.14
      - name: Validate exact source and regressions
        id: source_checks
        continue-on-error: true
        run: |
          node -e "require('node:assert/strict').match(process.env.SITE_CANDIDATE_SHA,/^[0-9a-f]{40}$/)"
          node -e "const a=require('node:assert/strict'),v=process.env.SITE_PUBLIC_VARIANT;a.ok(['base','color'].includes(v));if(v==='color')a.equal(process.env.SITE_TEST_PROFILE,'staging')"
          test "$(git rev-parse HEAD)" = "$SITE_CANDIDATE_SHA"
          node -e "const a=require('node:assert/strict');a.ok(['staging','production'].includes(process.env.SITE_VALIDATION_LEVEL));if(process.env.SITE_VALIDATION_LEVEL==='staging'){a.equal(process.env.SITE_TEST_PROFILE,'staging');a.ok(process.env.SITE_TEST_BASE_URL.startsWith('https://'));a.equal(process.env.SITE_AUTOMATED_ONLY,'true');a.equal(process.env.SITE_FULL,'true')}"
          status=0
          check() { "$@" || status=1; }
          if [ "$SITE_VALIDATION_LEVEL" = staging ]; then
            check node tools/quality/local.cjs
            check node tools/quality/source-tests.cjs --profile staging --require-clean
          else
            check node tools/quality/source-tests.cjs --profile production --require-clean
            check node tools/site/build.cjs --check
            check node tools/check_site_seo.cjs
            check node tools/build_scene_fallbacks.cjs --check
            check node tools/build_site_previews.cjs --check
            check python tools/build_site_bundle.py --check
          fi
          check python tools/repository_intelligence.py --config .github/repository-intelligence-config.json verify
          check python tools/run_repository_tests.py
          exit "$status"
      - name: Package public files once and enforce budgets
        if: inputs.public_artifact_id == ''
        run: node tools/quality/artifact.cjs build quality-artifact
      - name: Build the explicit Color rendition
        if: inputs.public_artifact_id == '' && inputs.public_variant == 'color'
        run: node tools/staging/color.cjs quality-artifact
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: inputs.public_artifact_id != ''
        with:
          artifact-ids: ${{ inputs.public_artifact_id }}
          run-id: ${{ inputs.public_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: quality-artifact
      - name: Verify reused bytes and exact source identity
        if: inputs.public_artifact_id != ''
        env:
          SITE_EXPECTED_PUBLIC_DIGEST: ${{ inputs.public_digest }}
        run: |
          node tools/quality/artifact.cjs verify quality-artifact/public quality-artifact/artifact.json
          node - <<'JS'
          const a=require('node:assert/strict'),m=require('./quality-artifact/artifact.json');
          a.equal(m.sourceCommit,process.env.SITE_CANDIDATE_SHA);a.equal(m.candidateCommit,m.sourceCommit);a.equal(m.sourceDirty,false);
          a.equal(m.sourceTree,require('node:child_process').execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim());
          a.equal(m.components.variant?.id||'base',process.env.SITE_PUBLIC_VARIANT,'wrong tested public rendition');
          JS
      - id: identity
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,'digest='+require('./quality-artifact/artifact.json').artifactDigest+'\n')"
      - id: upload
        if: inputs.public_artifact_id == ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: site-public-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  host:
    if: inputs.base_url != ''
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          run-id: ${{ needs.build.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: quality-artifact
      - name: Verify HTTPS, MIME, redirects, 404 and every served source byte
        run: node tools/quality/hosted.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: site-reports-host-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-reports/
          retention-days: 30
  static:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.validation_level == 'staging' && 15 || 20 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.14
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          run-id: ${{ needs.build.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: quality-artifact
      - name: Install locked tools
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          python -m venv tools/quality/toolchain/venv
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check -r tools/quality/toolchain/requirements.txt
      - name: Verify artifact and scanner fixtures
        run: |
          node tools/quality/artifact.cjs verify quality-artifact/public quality-artifact/artifact.json
          node tools/quality/selftest.cjs
      - name: Lint source
        if: ${{ !cancelled() }}
        run: node tools/quality/scanners.cjs lint
      - name: Security scans
        if: ${{ !cancelled() }}
        run: node tools/quality/scanners.cjs security
      - name: Dependency advisories
        if: ${{ !cancelled() }}
        run: node tools/quality/scanners.cjs advisories
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: site-reports-static-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-reports/
          retention-days: 30
  linux:
    if: inputs.validation_level == 'production'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SITE_AUDIT_ENGINES: ${{ inputs.full && 'chromium,firefox' || 'chromium,firefox,webkit' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          run-id: ${{ needs.build.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: quality-artifact
      - name: Bound Ubuntu downloads and use its primary archive
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          import re
          apt = Path('/etc/apt')
          sources = [apt / 'sources.list', *apt.glob('sources.list.d/*.list'), *apt.glob('sources.list.d/*.sources')]
          mirrors = {apt / 'apt-mirrors.txt'}
          for source in sources:
              if source.exists():
                  active = '\n'.join(line.split('#', 1)[0] for line in source.read_text().splitlines())
                  for name in re.findall(r'(?<!\S)mirror\+file:(?://)?(/etc/apt/[^\s#]+)', active):
                      mirror = Path(name)
                      if not mirror.resolve().is_relative_to(apt.resolve()) or not mirror.is_file():
                          raise ValueError('Invalid or missing active APT mirror list: ' + name)
                      mirrors.add(mirror)
          pattern = r'https?://azure\.archive\.ubuntu\.com/ubuntu(?=/|\s|$)'
          changed = []
          for source in [*sources, *sorted(mirrors)]:
              if not source.exists():
                  continue
              before = source.read_text()
              after = re.sub(pattern, 'https://archive.ubuntu.com/ubuntu', before)
              if after != before:
                  source.write_text(after)
                  changed.append(str(source))
              if re.search(pattern, source.read_text()):
                  raise ValueError('Azure archive remains in ' + str(source))
          (apt / 'apt.conf.d/99-site-download-bounds').write_text('Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "0";\n')
          print('Ubuntu source/mirror files moved to the primary archive:', changed)
          PYTHON
      - name: Install the pinned Node toolchain
        timeout-minutes: 3
        run: npm ci --prefix tools/quality/toolchain --ignore-scripts
      - name: Install Ubuntu engine dependencies without prior launch
        timeout-minutes: 5
        run: tools/quality/toolchain/node_modules/.bin/playwright install-deps chromium firefox webkit
      - name: Download pinned engines without prior launch
        timeout-minutes: 3
        run: |
          tools/quality/toolchain/node_modules/.bin/playwright install chromium firefox webkit
          command -v Xvfb
      - name: Assert the required Linux engine matrix
        run: |
          node tools/quality/artifact.cjs verify quality-artifact/public quality-artifact/artifact.json
          node tools/staging/selftest.cjs
          node tools/quality/functional.cjs
      - name: Assert Color ribbons, spatial flight and real edge scrolling
        if: inputs.public_variant == 'color' && !cancelled()
        run: node tools/quality/color-browser.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: site-reports-linux-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-reports/
          retention-days: 30
  native:
    if: inputs.validation_level == 'production' && inputs.full
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win32
            engines: chromium,firefox
          - os: macos-15
            platform: darwin
            engines: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      SITE_AUDIT_ENGINES: ${{ matrix.engines }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          run-id: ${{ needs.build.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: quality-artifact
      - name: Install pinned native engines
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          node tools/quality/toolchain/node_modules/playwright/cli.js install $SITE_AUDIT_ENGINES
        env:
          # CLI uses separate engine arguments, unlike the runner's comma list.
          SITE_AUDIT_ENGINES: ${{ matrix.platform == 'win32' && 'chromium firefox' || 'webkit' }}
      - name: Native full WebKit matrix
        if: matrix.platform == 'darwin'
        run: |
          node tools/quality/artifact.cjs verify quality-artifact/public quality-artifact/artifact.json
          node tools/quality/functional.cjs
      - name: Native Windows smoke matrix
        if: matrix.platform == 'win32'
        run: |
          node tools/quality/artifact.cjs verify quality-artifact/public quality-artifact/artifact.json
          node tools/quality/functional.cjs --smoke
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: site-reports-${{ matrix.platform }}-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-reports/
          retention-days: 30
  performance:
    if: inputs.validation_level == 'production' && inputs.full
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          run-id: ${{ needs.build.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: quality-artifact
      - run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          tools/quality/toolchain/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify performance input artifact
        run: |
          node tools/quality/artifact.cjs verify quality-artifact/public quality-artifact/artifact.json
      - name: Lighthouse samples and budgets
        id: lighthouse
        run: node tools/quality/lighthouse.cjs
      - name: Motion, CPU throttling and five-minute soak
        if: ${{ !cancelled() && steps.lighthouse.outcome != 'skipped' }}
        run: node tools/quality/motion.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: site-reports-performance-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-reports/
          retention-days: 30
  captures:
    if: inputs.validation_level == 'production' && inputs.full
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SITE_REVIEW_PLAYWRIGHT: ${{ github.workspace }}/tools/quality/toolchain/node_modules/playwright
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.14
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          run-id: ${{ needs.build.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: quality-artifact
      - name: Install locked capture tooling
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          tools/quality/toolchain/node_modules/.bin/playwright install --with-deps chromium
          python -m pip install Pillow==12.3.0
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
      - name: Capture all routes and actual motion from tested bytes
        run: |
          node tools/quality/artifact.cjs verify quality-artifact/public quality-artifact/artifact.json
          node tools/capture_site_review.cjs
          python tools/build_site_contact_sheets.py
          node tools/check_site_contrast.cjs
          node -e "const c=require('./review/site-v1-20261004-v11-captures/captures.json');require('./tools/quality/common.cjs').report('captures',c)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: site-reports-captures-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            quality-reports/
            review/site-v1-20261004-v11-captures/
          retention-days: 30
  staging:
    if: inputs.validation_level == 'staging'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          run-id: ${{ needs.build.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: quality-artifact
      - name: Install locked bounded staging browser tools
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          tools/quality/toolchain/node_modules/.bin/playwright install --with-deps chromium firefox
      - name: Verify the unchanged package and run representative browser and performance regression
        run: |
          node tools/quality/artifact.cjs verify quality-artifact/public quality-artifact/artifact.json
          node tools/quality/staging-regression.cjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: site-reports-staging-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-reports/
          if-no-files-found: error
          retention-days: 30
  gate:
    if: always()
    needs: [build, static, linux, native, performance, captures, host, staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.gate_upload.outputs.artifact-id }}
    env:
      SITE_JOB_RESULTS: ${{ toJSON(needs) }}
      SITE_EXPECTED_PUBLIC_DIGEST: ${{ needs.build.outputs.public_digest }}
      SITE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      SITE_UPLOAD_DIGEST: ${{ needs.build.outputs.artifact_upload_digest }}
      SITE_SOURCE_CHECKS_OUTCOME: ${{ needs.build.outputs.source_checks }}
      SITE_EVIDENCE_ARTIFACT_ID: ${{ inputs.evidence_artifact_id }}
      SITE_EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          run-id: ${{ needs.build.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: quality-artifact
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: site-reports-*-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-artifact/reports
          merge-multiple: false
      - name: Validate external evidence identifiers
        if: inputs.validation_level == 'production' && inputs.full && !inputs.automated_only && inputs.evidence_artifact_id != ''
        run: node -e "const a=require('node:assert/strict');a.match(process.env.SITE_EVIDENCE_ARTIFACT_ID,/^[0-9]+$/);a.match(process.env.SITE_EVIDENCE_RUN_ID,/^[0-9]+$/)"
      - name: Download immutable external review/device evidence
        if: inputs.validation_level == 'production' && inputs.full && !inputs.automated_only && inputs.evidence_artifact_id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ inputs.evidence_artifact_id }}
          run-id: ${{ inputs.evidence_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: quality-artifact/external-evidence
      - name: Validate completeness, source identity and mandatory results
        env:
          SITE_FULL: ${{ inputs.full }}
        run: |
          if [ "$SITE_VALIDATION_LEVEL" = staging ]; then
            unset SITE_RELEASE_EVIDENCE
            node tools/quality/staging-gate.cjs quality-artifact
          elif [ "$SITE_FULL" = true ]; then
            if [ -n "$SITE_EVIDENCE_ARTIFACT_ID" ]; then
              export SITE_RELEASE_EVIDENCE="$GITHUB_WORKSPACE/quality-artifact/external-evidence/release-evidence.json"
            fi
            node tools/quality/validate.cjs quality-artifact --full
          else
            unset SITE_RELEASE_EVIDENCE
            node tools/quality/validate.cjs quality-artifact
          fi
      - id: gate_upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: site-gate-full-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-artifact/release-manifest.json
          retention-days: 30
