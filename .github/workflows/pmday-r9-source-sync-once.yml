name: One-shot PMDay R9 source synchronization
on:
  push:
    branches: [work/issue-5-publisher-pmday-20261012]
    paths: [.github/workflows/pmday-r9-source-sync-once.yml]
permissions:
  contents: write
concurrency:
  group: pmday-r9-source-sync
  cancel-in-progress: false
jobs:
  synchronize:
    if: github.repository == 'oborskyivitalii/oborskyivitalii'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Install existing locked source-check toolchains
        run: |
          npm ci --prefix tools/publishing/toolchain --ignore-scripts
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          python3 -m venv tools/quality/toolchain/venv
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check --no-deps ruff==0.16.10 PyYAML==6.0.3
      - name: Replay only the exact already-validated editorial and semantic transforms
        run: |
          tools/quality/toolchain/venv/bin/python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          # The previous run verified these exact transforms and reader hash.
          # Reuse the immutable authored script rather than copying the prose again.
          source = 'c16210a3cac633ff74b07b16b84f310d1097c37d:.github/workflows/pmday-r9-source-sync-once.yml'
          blob = subprocess.check_output(['git', 'rev-parse', source], text=True).strip()
          assert blob == 'e39a31f96c4b36631d4abc7223768c80c85e4d34', 'Pinned transformation changed'
          workflow = yaml.safe_load(subprocess.check_output(['git', 'show', source], text=True))
          steps = workflow['jobs']['synchronize']['steps']
          names = [
              'Apply the reviewed R9 editorial changes to both reader owners',
              'Extract exact named URLs and freeze the new review semantic edition',
          ]
          for name in names:
              selected = [step for step in steps if step.get('name') == name]
              assert len(selected) == 1 and isinstance(selected[0].get('run'), str)
              print('::group::' + name, flush=True)
              subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', selected[0]['run']], check=True)
              print('::endgroup::', flush=True)
          review_path = Path('review/issue-2/pmday-candidate-20261015/README.md')
          review = review_path.read_text()
          anchor = '#2 AC01–AC06 and applicable #5 author/rights/publication gates remain open;'
          detail = ('Follow-up run 39128822230 still failed the same map because the direct Prettier CLI used its defaults, while the repository guard supplies tools/quality/prettier.config.json explicitly. This run uses that exact checked configuration before and after CI-map refresh. Both failed runs remain historical failures; their reader/semantic checks succeeded, but neither committed R9. No quality assertion, path coverage or budget was weakened.\n\n')
          assert anchor in review
          review_path.write_text(review.replace(anchor, detail + anchor, 1))
          PY
      - name: Remove the temporary job and stage only the changed source owners
        run: |
          git rm .github/workflows/pmday-r9-source-sync-once.yml
          git add drafts/pmday-article-draft.en.md site/publications/pmday-ai-both-sides/
          git add .github/repository-paths.json MEMORY.md review/issue-2/pmday-candidate-20261015/README.md
      - name: Apply the exact repository formatter configuration to scoped JSON paths
        run: |
          tools/quality/toolchain/node_modules/.bin/prettier --config tools/quality/prettier.config.json --write .github/ri-ci-map.json .github/repository-paths.json site/publications/pmday-ai-both-sides/publication.json site/publications/pmday-ai-both-sides/profile.json site/publications/pmday-ai-both-sides/editions/pmday-ai-both-sides-en-review-20261018-r9.json
          git add .github/ri-ci-map.json .github/repository-paths.json site/publications/pmday-ai-both-sides/
          node tools/quality/format.cjs --check
      - name: Validate the actual article without generating platform outputs
        run: node tools/publishing/cli.cjs validate pmday-ai-both-sides
      - name: Refresh and verify repository intelligence with existing checks
        run: |
          python3 tools/check_ri_ci.py refresh
          tools/quality/toolchain/node_modules/.bin/prettier --config tools/quality/prettier.config.json --write .github/ri-ci-map.json
          python3 tools/check_ri_ci.py verify
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json build
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json verify
          python3 -m unittest discover -s tests -p 'test_repository_intelligence.py'
          python3 -m unittest discover -s tests -p 'test_ri_ci.py'
      - name: Run existing Basic source checks and final formatting verification
        run: |
          node tools/quality/local.cjs
          node tools/quality/format.cjs --check
      - name: Verify exact reader parity and commit the coordinated R9 source
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const draft = fs.readFileSync('drafts/pmday-article-draft.en.md', 'utf8');
          const reader = draft.split('<!-- ARTICLE START -->')[1].split('<!-- ARTICLE END -->')[0].trim() + '\n';
          const canonical = fs.readFileSync('site/publications/pmday-ai-both-sides/manuscript.en.md', 'utf8');
          if (reader !== canonical) throw Error('Reader owners diverged');
          if (crypto.createHash('sha256').update(reader).digest('hex') !== '7c3ab33f4940f27020318cfefd79a48c33af5a35e2921ed2aeb511f4ada97cbd') throw Error('Reader differs from R9 PDF input');
          NODE
          git add .github/ri-ci-map.json .github/repository-intelligence/ REPOSITORY-MAP.md
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content(article): synchronize R9 quotations, systemic responsibility and review edition (Refs #5)'
          test -z "$(git status --porcelain)"
          remote_head=$(git ls-remote origin refs/heads/work/issue-5-publisher-pmday-20261012 | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:work/issue-5-publisher-pmday-20261012
