name: Authorized production release or rollback
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit production action; never runs on push or staging
        required: true
        type: choice
        options: [publish, rollback]
      release_tag:
        description: Immutable prod-YYYY-MM-DD.N identity
        required: true
        type: string
      validation_run_id:
        description: Successful full prospective-production validation (publish only)
        type: string
        default: ''
      release_pr:
        description: Merged PR matching the exact source (publish only)
        type: string
        default: ''
      release_evidence:
        description: Exact-source independent/device/rights JSON; rights.inventoryDigest must match the frozen candidate (publish only)
        type: string
        default: ''
      first_release_preparation_run:
        description: Authenticated current-controller recovery preparation for the first canonical publication only
        type: string
        default: ''
      first_release_preparation_attempt:
        description: Exact successful preparation attempt; required with first_release_preparation_run
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: author-pages-publication
  cancel-in-progress: false
jobs:
  disabled:
    if: vars.SITE_PRODUCTION_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: |
          echo 'Production is disabled. An owner release decision and configured controls are required.'
          exit 1
  authorization:
    if: >-
      vars.SITE_PRODUCTION_ENABLED == 'true' && github.repository == 'oborskyivitalii/oborskyivitalii' &&
      github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    outputs:
      gate_id: ${{ steps.request.outputs.gate_id }}
      validation_run: ${{ steps.request.outputs.validation_run }}
      request_id: ${{ steps.retained.outputs.artifact-id }}
      preparation_id: ${{ steps.request.outputs.preparation_id }}
      preparation_digest: ${{ steps.request.outputs.preparation_digest }}
    env:
      PRODUCTION_ENABLED: ${{ vars.SITE_PRODUCTION_ENABLED }}
      PRODUCTION_APP_ID: ${{ vars.PRODUCTION_APP_ID }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      VALIDATION_RUN: ${{ inputs.validation_run_id }}
      RELEASE_PR: ${{ inputs.release_pr }}
      RELEASE_EVIDENCE: ${{ inputs.release_evidence }}
      FIRST_RELEASE_PREPARATION_RUN: ${{ inputs.first_release_preparation_run }}
      FIRST_RELEASE_PREPARATION_ATTEMPT: ${{ inputs.first_release_preparation_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - id: production-app
        name: Mint the installed production App token for protected settings inspection
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PRODUCTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRODUCTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
          permission-metadata: read
      - id: request
        name: Authenticate owner, source protection and complete real production jobs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PRODUCTION_APP_TOKEN: ${{ steps.production-app.outputs.token }}
        with:
          script: await require('./tools/release/actions.cjs').resolve(github,context,core)
      - id: retained
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-production-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-control/
          if-no-files-found: error
          retention-days: 90
  publish:
    name: Pages publication
    needs: authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
      deployments: write
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_ENABLED: ${{ vars.SITE_PRODUCTION_ENABLED }}
      PRODUCTION_APP_ID: ${{ vars.PRODUCTION_APP_ID }}
      SITE_TEST_PROFILE: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.authorization.outputs.request_id }}
          path: release-control
      - name: Authenticate and extract the first-release recovery capsule
        if: needs.authorization.outputs.preparation_id != ''
        env:
          PREPARATION_ID: ${{ needs.authorization.outputs.preparation_id }}
          PREPARATION_DIGEST: ${{ needs.authorization.outputs.preparation_digest }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREPARATION_ID/zip" > preparation-upload.zip
          python3 tools/pages/unpack.py preparation-upload.zip first-release-prepared "$PREPARATION_DIGEST"
      - id: configure
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - id: previous
        name: Authenticate configured origin and previous complete recovery receipt
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PAGES_ORIGIN: ${{ steps.configure.outputs.base_url }}
        with:
          script: await require('./tools/release/actions.cjs').previous(github,context,core)
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: steps.previous.outputs.first_release != 'true'
        with:
          artifact-ids: ${{ steps.previous.outputs.id }}
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ github.token }}
          path: pages-previous
      - name: Verify previous exact hosted bytes before any publication
        env:
          PAGES_ORIGIN: ${{ steps.configure.outputs.base_url }}
        run: |
          node -e "require('./tools/release/actions.cjs').verifyPrevious().catch(error=>{console.error(error);process.exitCode=1})"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: inputs.operation == 'publish'
        with:
          artifact-ids: ${{ needs.authorization.outputs.gate_id }}
          run-id: ${{ needs.authorization.outputs.validation_run }}
          github-token: ${{ github.token }}
          path: validation-gate
      - id: public
        if: inputs.operation == 'publish'
        name: Authenticate the exact full-tested public artifact and producer
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: await require('./tools/release/actions.cjs').publicInputs(github,context,core)
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: inputs.operation == 'publish'
        with:
          artifact-ids: ${{ steps.public.outputs.id }}
          run-id: ${{ steps.public.outputs.run }}
          github-token: ${{ github.token }}
          path: production-source
      - id: production-app
        name: Mint the installed production App token for protected refs and archives
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PRODUCTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRODUCTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
          permission-contents: write
          permission-workflows: write
          permission-metadata: read
      - name: Verify full/external admission and prepare the frozen archive locally
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PRODUCTION_APP_TOKEN: ${{ steps.production-app.outputs.token }}
        with:
          script: await require('./tools/release/actions.cjs').prepareArchive(github,context)
      - name: Compose production-only root and retain the predecessor solely for recovery
        run: node -e "require('./tools/release/actions.cjs').compose()"
      - name: Verify complete local composition before writing draft archive assets
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PRODUCTION_APP_TOKEN: ${{ steps.production-app.outputs.token }}
        with:
          script: await require('./tools/release/actions.cjs').publishPreparedArchive(github,context)
      - name: Retain the complete next combined site before touching live Pages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pages-package/
            pages-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Install the small post-publication navigation smoke
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          tools/quality/toolchain/node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: pages-package/public
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          name: github-pages-rollback
          path: pages-previous/pages-package/public
      - id: pending
        name: Retain the transition lease and create a pending production deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PRODUCTION_APP_TOKEN: ${{ steps.production-app.outputs.token }}
        with:
          script: await require('./tools/release/actions.cjs').begin(github,context)
      - name: Retain the created deployment and exact bookkeeping recovery state
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-production-transition-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-control/
          if-no-files-found: error
          retention-days: 90
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - id: http
        name: Verify every combined Pages file, routes, query and real 404
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          PAGES_ORIGIN: ${{ steps.configure.outputs.base_url }}
        run: node tools/pages/http.cjs pages-package "$PAGES_ORIGIN" pages-reports/http.json
      - id: policy
        name: Verify production TLS, MIME, canonical and indexing on the exact archive
        if: steps.http.outcome == 'success'
        continue-on-error: true
        run: node tools/release/live.cjs production-source release-assets/archive.json pages-reports/production-policy.json
      - id: browser
        name: Verify production navigation on live Pages
        if: steps.policy.outcome == 'success'
        continue-on-error: true
        env:
          PAGES_ORIGIN: ${{ steps.configure.outputs.base_url }}
        run: |
          SITE_TEST_BASE_URL="$PAGES_ORIGIN/" SITE_PUBLIC_DIR="$GITHUB_WORKSPACE/production-source/public" SITE_ARTIFACT_MANIFEST="$GITHUB_WORKSPACE/production-source/artifact.json" SITE_REPORT_DIR="$GITHUB_WORKSPACE/pages-reports/production-browser" node tools/quality/local-browser.cjs --smoke
      - id: passive
        name: Bounded passive ZAP scan on the production origin only
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p pages-reports/zap
          node tools/release/passive.cjs plan pages-reports/zap/plan.json
          chmod 777 pages-reports/zap
          docker run --rm --network bridge -v "$GITHUB_WORKSPACE/pages-reports/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2 zap.sh -cmd -autorun /zap/wrk/plan.json
          node tools/release/passive.cjs verify pages-reports/zap/zap.json pages-reports/passive.json
      - id: observations
        name: Retain all actual observations before marking production accepted
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-production-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-control/
            pages-reports/
            release-assets/archive.json
          if-no-files-found: error
          retention-days: 90
      - id: accepted
        name: Freeze durable live evidence then update production source, labels and deployment
        if: >-
          steps.deploy.outcome == 'success' && steps.http.outcome == 'success' &&
          steps.policy.outcome == 'success' && steps.browser.outcome == 'success' &&
          steps.passive.outcome == 'success' && steps.observations.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          OBSERVATIONS_RETAINED: 'true'
          PRODUCTION_APP_TOKEN: ${{ steps.production-app.outputs.token }}
        with:
          script: await require('./tools/release/actions.cjs').accept(github,context)
      - id: rollback
        name: Restore previous exact combined Pages bytes on any failed transition
        if: always() && steps.deploy.outcome != 'skipped' && steps.accepted.outcome != 'success'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: github-pages-rollback
      - name: Verify restored bytes before restoring production bookkeeping
        if: steps.rollback.outcome == 'success'
        env:
          PAGES_ORIGIN: ${{ steps.configure.outputs.base_url }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const actions = require('./tools/release/actions.cjs');
            await actions.restoreSettings(github,context);
            await actions.verifyRecovery();
      - name: Restore previous production ref, label state and deployment identity
        if: steps.rollback.outcome == 'success' && success()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PRODUCTION_APP_TOKEN: ${{ steps.production-app.outputs.token }}
        with:
          script: await require('./tools/release/actions.cjs').recover(github,context)
      - name: Mark a created deployment failed when live publication never started
        if: always() && steps.deploy.outcome == 'skipped'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: await require('./tools/release/actions.cjs').abandoned(github,context)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always() && steps.accepted.outcome != 'success'
        with:
          name: site-production-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-control/
            pages-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Keep incomplete publication or recovery red
        if: always() && steps.accepted.outcome != 'success'
        run: exit 1
