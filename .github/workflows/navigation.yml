name: Local navigation checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    name: Local navigation and RI freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the pinned source-test Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      # site-checks.yml owns Basic and changed-source tests. Only cheap RI,
      # profile/gate fixtures run here; hosted matrices have separate triggers.
      - name: Verify reviewed RI and CI coverage
        run: python3 tools/check_ri_ci.py verify
      - name: Check RI and CI coupling regression cases
        run: python3 -m unittest discover -s tests -p 'test_ri_ci.py'
      - name: Check profile selection and fail-closed staging controls
        run: node --test tests/test-profile-selection.test.cjs tests/staging-gate.test.cjs tests/staging-regression.test.cjs tests/quality-sources.test.cjs
      - name: Check repository entry points, guide routes and preserved history
        run: python3 -m unittest discover -s tests -p 'test_root_layout.py'
      - name: Check enduring and owning-issue test selection
        run: python3 -m unittest discover -s tests -p 'test_repository_test_selection.py'
      - name: Check RI inventory and agent-memory contract
        run: python3 -m unittest discover -s tests -p 'test_repository_intelligence.py'
      - name: Verify current-source context
        run: |
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json verify
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          surface = '.github/repository-intelligence/agent-context.json'
          readable = 'REPOSITORY-MAP.md'
          record = {
              'checkout_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'source_dirty': bool(subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'])),
              'surface_path': surface,
              'surface_sha256': hashlib.sha256(Path(surface).read_bytes()).hexdigest(),
              'map_path': readable,
              'map_sha256': hashlib.sha256(Path(readable).read_bytes()).hexdigest(),
              'source_digest': json.loads(Path(surface).read_text())['source_identity']['digest'],
          }
          if record['source_dirty']:
              raise SystemExit('Cannot bind RI evidence to a dirty checkout')
          print('Verified context checkout: ' + json.dumps(record, sort_keys=True))
          PY
