name: Local navigation checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    name: Local navigation and RI freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # site-checks.yml owns the one basic suite. The complete Python/browser/
      # export suites already run in hosted release checks; do not duplicate
      # them here on every PR and main update.
      - name: Verify current-source context
        run: python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json verify
