name: Merged repository and staging identity
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  issues: read
jobs:
  identity:
    if: >-
      github.repository == 'oborskyivitalii/oborskyivitalii' &&
      vars.SITE_PR_STAGING_ENABLED == 'true' &&
      github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: path
        name: Select normal staging or an explicit owner maintenance decision
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs=require('node:fs'),maintenance=require('./tools/staging/maintenance.cjs');
            fs.mkdirSync('merge-reports',{recursive:true});
            try{
              const pr=(await github.rest.pulls.get({...context.repo,pull_number:context.payload.pull_request.number})).data;
              const approval=await maintenance.ownerDecision(github,context,pr);
              if(!approval){core.setOutput('maintenance','false');return;}
              const record=await maintenance.verify(github,context,pr,approval);
              fs.writeFileSync('merge-reports/maintenance-preflight.json',JSON.stringify(record,null,2)+'\n');
              core.setOutput('maintenance','true');
              core.setOutput('stateId',record.preservedSite.previous.stateId);
              core.setOutput('stateRun',record.preservedSite.previous.runId);
            }catch(error){
              fs.writeFileSync('merge-reports/identity.json',JSON.stringify({pass:false,error:error.message},null,2)+'\n');
              throw error;
            }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: steps.path.outputs.maintenance == 'true'
        with:
          artifact-ids: ${{ steps.path.outputs.stateId }}
          run-id: ${{ steps.path.outputs.stateRun }}
          github-token: ${{ github.token }}
          path: merge-reports/previous
      - name: Preserve the previous accepted site identity after a CI maintenance merge
        if: steps.path.outputs.maintenance == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs=require('node:fs'),maintenance=require('./tools/staging/maintenance.cjs');
            try{
              const preliminary=JSON.parse(fs.readFileSync('merge-reports/maintenance-preflight.json'));
              const record=await maintenance.preserveSite(github,context,preliminary,fs.readFileSync('merge-reports/previous/recovery.json'));
              fs.writeFileSync('merge-reports/identity.json',JSON.stringify(record,null,2)+'\n');
              await core.summary.addHeading('Controller maintenance merge').addRaw('Repository source '+record.mergedSource+' verified. Previous accepted site remains '+record.preservedSite.state.sourceCommit+'. Staging acceptance and production eligibility are false.').write();
            }catch(error){
              fs.writeFileSync('merge-reports/identity.json',JSON.stringify({kind:'controller-maintenance-merge',pass:false,error:error.message},null,2)+'\n');
              throw error;
            }
      - name: Bind the actual merge tree to the accepted PR and Cloudflare staging
        if: steps.path.outputs.maintenance == 'false'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const fs=require('node:fs');
            fs.mkdirSync('merge-reports',{recursive:true});
            try{
              const pr=(await github.rest.pulls.get({...context.repo,pull_number:context.payload.pull_request.number})).data;
              const record=await require('./tools/staging/admission.cjs').verifyMerge(github,context,pr);
              fs.writeFileSync('merge-reports/identity.json',JSON.stringify(record,null,2)+'\n');
              await core.summary.addHeading('Accepted staging merge').addRaw('Tested source: '+record.testedSource+'; merged source: '+record.mergedSource+'; identical source tree: '+record.sourceTree+'. The tested package remains unchanged.').write();
            }catch(error){
              fs.writeFileSync('merge-reports/identity.json',JSON.stringify({pass:false,error:error.message},null,2)+'\n');
              throw error;
            }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: site-staging-merge-${{ github.run_id }}-${{ github.run_attempt }}
          path: merge-reports/
          if-no-files-found: error
          retention-days: 90
