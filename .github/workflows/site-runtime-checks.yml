name: Site runtime regressions
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
      - name: Focused runtime, content and archive regressions
        run: node --test tests/theme.test.cjs tests/space.test.cjs tests/archive.test.cjs tests/content.test.cjs
      - name: Check deterministic lightweight fallback
        run: node tools/build_scene_fallbacks.cjs --check
      - name: Enforce page and decorative DOM budgets
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          for(const route of ['index','research','writing','talks','credits']){
            const bytes=fs.readFileSync('docs/'+route+'.html'),html=bytes.toString(),svg=html.match(/<svg class="space-fallback"[\s\S]*?<\/svg>/)?.[0];
            assert.ok(svg,'missing static fallback');
            const nodes=(svg.match(/<[a-z][\w-]*(?:\s|>)/gi)||[]).length;
            assert.ok(bytes.length<=100000,route+' HTML exceeds 100KB');
            assert.ok(nodes<=250,route+' decorative SVG exceeds 250 nodes');
            console.log(JSON.stringify({route,htmlBytes:bytes.length,svgNodes:nodes}));
          }
          JS
