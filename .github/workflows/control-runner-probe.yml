name: Control runner containment experiment
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/quality/control-runner*.cjs
      - tools/quality/delivery-json.cjs
      - tests/control-runner.test.cjs
      - .github/workflows/control-runner-probe.yml
      - guides/SITE-CONTROL-CHANGES.md
permissions:
  contents: read
jobs:
  containment:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Exercise bounded containment without admission authority
        env:
          CONTROL_BASE: ${{ github.event.pull_request.base.sha }}
          CONTROL_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tools/quality/control-runner-proof.cjs "$CONTROL_BASE" "$CONTROL_HEAD" "$RUNNER_TEMP/control-runner"
      - name: Retain original execution evidence including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: control-runner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control-runner/
          if-no-files-found: error
          retention-days: 30
