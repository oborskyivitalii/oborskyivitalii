name: Pages staging mirror
on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      staging_run_id:
        required: true
        type: string
      producer_attempt:
        required: true
        type: string
      public_artifact_id:
        required: true
        type: string
      public_digest:
        required: true
        type: string
      public_upload_digest:
        required: true
        type: string
      gate_artifact_id:
        required: true
        type: string
    outputs:
      page_url:
        value: ${{ jobs.deploy.outputs.page_url }}
permissions:
  contents: read
  actions: read
concurrency:
  group: author-pages-publication
  cancel-in-progress: false
jobs:
  deploy:
    name: Pages publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.origin.outputs.url }}/
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      SITE_EXPECTED_PUBLIC_DIGEST: ${{ inputs.public_digest }}
      SITE_ARTIFACT_ID: ${{ inputs.public_artifact_id }}
      SITE_UPLOAD_DIGEST: ${{ inputs.public_upload_digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - id: configure
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: origin
        name: Normalize the configured canonical Pages origin
        env:
          PAGES_CONFIGURED: ${{ steps.configure.outputs.base_url }}
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,'url='+require('./tools/pages/http.cjs').origin(process.env.PAGES_CONFIGURED)+'\n')"
      - name: Authenticate controller and actual successful staging producer
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          STAGING_RUN: ${{ inputs.staging_run_id }}
          PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
          GATE_ARTIFACT: ${{ inputs.gate_artifact_id }}
        with:
          script: |
            const controller=require('./tools/pages/controller.cjs'),flow=require('./tools/staging/review-flow.cjs');
            controller.controller(context,(await github.rest.repos.getBranch({...context.repo,branch:'main'})).data);
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:flow.positive(process.env.STAGING_RUN)})).data;
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:run.id,filter:'latest'});
            controller.stagingRun(run,jobs);
            const item=(await github.rest.actions.getArtifact({...context.repo,artifact_id:flow.positive(process.env.SITE_ARTIFACT_ID)})).data;
            controller.artifactIdentity(item,run,process.env.SITE_ARTIFACT_ID,process.env.SITE_UPLOAD_DIGEST,'site-public-review-'+run.id+'-'+flow.positive(process.env.PRODUCER_ATTEMPT));
            const gate=(await github.rest.actions.getArtifact({...context.repo,artifact_id:flow.positive(process.env.GATE_ARTIFACT)})).data;
            require('node:assert/strict').match(gate.name,new RegExp('^site-gate-full-staging-'+run.id+'-[1-9][0-9]*$'));
            controller.artifactIdentity(gate,run,gate.id,gate.digest,gate.name);
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ inputs.public_artifact_id }}
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
          path: staging-source
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ inputs.gate_artifact_id }}
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
          path: staging-gate
      - name: Verify actual bounded gate and frozen staging edition
        run: |
          node tools/quality/artifact.cjs verify staging-source/public staging-source/artifact.json
          node - <<'JS'
          const a=require('node:assert/strict'),m=require('./staging-source/artifact.json'),g=require('./staging-gate/release-manifest.json');
          a.equal(m.sourceCommit,process.env.SITE_CANDIDATE_SHA);a.equal(m.sourceDirty,false);
          require('./tools/quality/staging-gate.cjs').validateGate(m,g,g.hostedOrigin);
          a.equal(String(g.githubArtifact.id),process.env.SITE_ARTIFACT_ID);
          a.equal(g.githubArtifact.uploadDigest,process.env.SITE_UPLOAD_DIGEST);
          require('./tools/pages/package.cjs').checkStaging('staging-source',m);
          JS
      - id: production
        name: Resolve the currently accepted production archive
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const value=await require('./tools/pages/controller.cjs').activeProduction(github,context);
            core.setOutput('record',JSON.stringify(value));
            if(value){core.setOutput('tag',value.tag);core.setOutput('digest',value.publicDigest);core.setOutput('source',value.sourceCommit);}
      - id: previous
        name: Authenticate the current Pages receipt and retained recovery
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PAGES_URL: ${{ steps.origin.outputs.url }}
          PRODUCTION_RECORD: ${{ steps.production.outputs.record }}
        with:
          script: |
            const previous=await require('./tools/pages/controller.cjs').previous(github,context,process.env.PAGES_URL,JSON.parse(process.env.PRODUCTION_RECORD));
            core.setOutput('record',JSON.stringify(previous));
            if(previous){core.setOutput('id',previous.artifactId);core.setOutput('run',previous.runId);}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        if: steps.previous.outputs.id != ''
        with:
          artifact-ids: ${{ steps.previous.outputs.id }}
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ github.token }}
          path: pages-previous
      - name: Verify retained and currently hosted recovery bytes before publication
        if: steps.previous.outputs.id != ''
        env:
          PREVIOUS_RECORD: ${{ steps.previous.outputs.record }}
        run: |
          node -e "require('./tools/pages/controller.cjs').retained('pages-previous/pages-package',JSON.parse(process.env.PREVIOUS_RECORD))"
          node tools/pages/http.cjs pages-previous/pages-package "${{ steps.origin.outputs.url }}" pages-reports/previous-http.json
      - name: Restore durable production bytes when production is active
        if: steps.production.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.production.outputs.tag }}
          RELEASE_PUBLIC_DIGEST: ${{ steps.production.outputs.digest }}
          RELEASE_SOURCE: ${{ steps.production.outputs.source }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern public.tar.gz --pattern archive.json --dir production-release
          node -e "const r=require('./production-release/archive.json'),a=require('node:assert/strict');a.equal(r.tag,process.env.RELEASE_TAG);a.equal(r.publicDigest,process.env.RELEASE_PUBLIC_DIGEST);a.equal(r.sourceCommit,process.env.RELEASE_SOURCE);require('node:fs').appendFileSync(process.env.GITHUB_ENV,'RELEASE_PACKAGE_DIGEST='+r.packageDigest+'\n')"
      - name: Extract and verify the production archive
        if: steps.production.outputs.tag != ''
        run: |
          python3 tools/release/package.py unpack production-release/public.tar.gz production-source "$RELEASE_PACKAGE_DIGEST"
          node -e "require('./tools/release/archive.cjs').verify('production-source',require('./production-release/archive.json'),require('node:fs').readFileSync('production-release/public.tar.gz'))"
      - name: Compose staging while preserving accepted production file hashes
        env:
          RELEASE_TAG: ${{ steps.production.outputs.tag }}
        run: |
          node - <<'JS'
          const pkg=require('./tools/pages/package.cjs');
          pkg.build('staging-source','pages-package',process.env.RELEASE_TAG?'production-source':null,process.env.RELEASE_TAG||null,{kind:'ci-pages',runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,controller:process.env.GITHUB_SHA});
          require('node:fs').mkdirSync('pages-reports',{recursive:true});
          JS
      - name: Retain the complete new package before touching the live site
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pages-package/
            pages-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Install the small hosted Pages navigation smoke
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          tools/quality/toolchain/node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: pages-package/public
      - name: Retain the previous complete Pages artifact for exact recovery
        if: steps.previous.outputs.id != ''
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          name: github-pages-rollback
          path: pages-previous/pages-package/public
      - name: Recheck the publication controller and active production lease
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PRODUCTION_RECORD: ${{ steps.production.outputs.record }}
        with:
          script: |
            const a=require('node:assert/strict'),controller=require('./tools/pages/controller.cjs');
            controller.controller(context,(await github.rest.repos.getBranch({...context.repo,branch:'main'})).data);
            a.deepEqual(await controller.activeProduction(github,context),JSON.parse(process.env.PRODUCTION_RECORD),'active production changed during composition');
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify every hosted Pages byte, staging path and real 404
        id: http
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: node tools/pages/http.cjs pages-package "${{ steps.origin.outputs.url }}" pages-reports/http.json
      - name: Verify actual staged navigation on the Pages subpath
        id: browser
        if: steps.deploy.outcome == 'success' && steps.http.outcome == 'success'
        continue-on-error: true
        env:
          SITE_TEST_BASE_URL: ${{ steps.origin.outputs.url }}/staging/
          SITE_TEST_PROFILE: staging
          SITE_PUBLIC_DIR: ${{ github.workspace }}/staging-source/public
          SITE_ARTIFACT_MANIFEST: ${{ github.workspace }}/staging-source/artifact.json
          SITE_REPORT_DIR: ${{ github.workspace }}/pages-reports
        run: node tools/quality/local-browser.cjs --smoke
      - id: observations
        name: Retain actual publication observations before acceptance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        continue-on-error: true
        with:
          name: site-pages-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-reports/
          if-no-files-found: error
          retention-days: 90
      - id: rollback
        name: Restore the previous exact combined Pages artifact on a failed update
        if: >-
          always() && steps.previous.outputs.id != '' && steps.deploy.outcome != 'skipped' &&
          (steps.deploy.outcome == 'failure' || steps.http.outcome == 'failure' || steps.browser.outcome == 'failure' || steps.observations.outcome == 'failure')
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: github-pages-rollback
      - name: Verify the restored Pages publication
        if: steps.rollback.outcome == 'success'
        run: node tools/pages/http.cjs pages-previous/pages-package "${{ steps.origin.outputs.url }}" pages-reports/rollback-http.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always() && steps.rollback.outcome == 'success'
        with:
          name: site-pages-recovery-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Keep failed publication or recovery red
        if: always() && (steps.deploy.outcome != 'success' || steps.http.outcome != 'success' || steps.browser.outcome != 'success' || steps.observations.outcome != 'success')
        run: exit 1
