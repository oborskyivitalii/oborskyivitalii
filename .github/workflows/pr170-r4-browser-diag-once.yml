name: PR170 one-time R4 browser and retention diagnosis
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  verify:
    if: >-
      ${{ github.event.pull_request.number == 170 &&
          github.repository == 'oborskyivitalii/oborskyivitalii' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'work/issue-169-sdlc-out-of-balance-plan' &&
          github.actor == 'oborskyivitalii' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.14
      - name: Verify exact corrected tests and rebuild RI source projections
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rm .github/workflows/pr170-r4-browser-diag-once.yml
          git add -A -- .github/workflows/pr170-r4-browser-diag-once.yml
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          npm ci --prefix tools/publishing/toolchain --ignore-scripts
          python3 -m venv tools/quality/toolchain/venv
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check --no-deps ruff==0.16.10 PyYAML==6.0.3 packaging==26.3
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check --no-deps "$(python3 tools/publishing/web-media.py --requirement)"
          node tools/quality/toolchain/node_modules/prettier/bin/prettier.cjs --config tools/quality/prettier.config.json --write tests/article-delivery.test.cjs tools/quality/article-browser.cjs
          python3 tools/check_ri_ci.py refresh
          node tools/quality/toolchain/node_modules/prettier/bin/prettier.cjs --config tools/quality/prettier.config.json --write .github/ri-ci-map.json
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json build
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json verify
          python3 tools/check_ri_ci.py verify
          node tools/quality/format.cjs --check
          node --test tests/article-delivery.test.cjs tests/article-browser-evidence.test.cjs
          git add -A -- tests/article-delivery.test.cjs tools/quality/article-browser.cjs .github/ri-ci-map.json REPOSITORY-MAP.md .github/repository-intelligence/agent-context.json
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "test: bind R4 browser diagnosis and historical retention tests (Refs #169)"
          git push origin HEAD:refs/heads/work/issue-169-sdlc-out-of-balance-plan
