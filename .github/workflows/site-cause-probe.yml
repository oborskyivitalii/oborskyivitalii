name: Cold browser cause attribution
# One dated #23 follow-up: original deadlines and failed samples stay intact.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/site-cause-probe.yml'
      - 'tools/quality/cause-probe.cjs'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate for private cause attribution
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cause-probe-${{ github.event.pull_request.number || inputs.candidate_sha }}
  cancel-in-progress: true
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.number == 23 && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        scope: [webkit, lighthouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SITE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - name: Verify exact private inputs
        run: |
          node --test tests/cause-probe.test.cjs
          node - <<'JS'
          const root=process.env.RUNNER_TEMP+'/cause-input';
          require('./tools/quality/artifact.cjs').build(root+'/color');
          require('./tools/staging/color.cjs').build(root+'/color');
          require('./tools/quality/writing-variants.cjs').derive(root+'/color',root+'/control','browser-gate-trace');
          JS
      - name: Install pinned browser tools
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          tools/quality/toolchain/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Retain original failures and function-level profiles
        run: >-
          node tools/quality/cause-probe.cjs ${{ matrix.scope }}
          "$RUNNER_TEMP/cause-input/color"
          "$RUNNER_TEMP/cause-input/control"
          "$RUNNER_TEMP/cause-results"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: cause-diagnostic-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cause-results/
          if-no-files-found: error
          retention-days: 90
