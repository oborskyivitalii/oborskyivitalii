name: Cold browser cause attribution
# Historical Research/WebKit replay remains manual. Issue45 four-input Writing
# and issue39 current Writing are explicit same-repository jobs, never admission.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate for private cause attribution
        required: true
        type: string
      scope:
        description: Historical private cases or bounded current-production analytics observation
        required: true
        default: historical
        type: choice
        options: [historical, analytics-live]
      release_tag:
        description: Accepted immutable current production tag, required only for analytics-live
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: cause-probe-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.event.label.name) || inputs.candidate_sha }}
  cancel-in-progress: true
jobs:
  analytics-live:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.scope == 'analytics-live' &&
      github.repository == 'oborskyivitalii/oborskyivitalii' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      deployments: read
    env:
      SITE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      SITE_ANALYTICS_RELEASE: ${{ inputs.release_tag }}
      SITE_ANALYTICS_LIVE_DIR: ${{ runner.temp }}/analytics-live-input
      SITE_REPORT_DIR: ${{ runner.temp }}/analytics-live-results
      SITE_TEST_PROFILE: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - name: Install the existing locked diagnostic tools
        run: npm ci --prefix tools/quality/toolchain --ignore-scripts
      - name: Check the bounded diagnostic and historical routing negatives
        run: node --test tests/cause-probe.test.cjs
      - name: Authenticate and restore the exact accepted production archive
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: await require('./tools/quality/analytics-live-actions.cjs').prepare(github,context)
      - name: Install the pinned Chromium system dependencies
        run: tools/quality/toolchain/node_modules/.bin/playwright install-deps chromium
      - name: Restore verified pinned Chromium without prior launch
        uses: ./.github/actions/browser-archive
        with:
          browsers: chromium
      - name: Record two Forward conditions and a separate real-SDK CPU sample
        id: observe
        continue-on-error: true
        run: node tools/quality/analytics-live.cjs "$SITE_ANALYTICS_LIVE_DIR/target" "$SITE_REPORT_DIR"
      - name: Recheck production identity and retain the actual diagnostic verdict
        if: always() && (steps.observe.outcome == 'success' || steps.observe.outcome == 'failure')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: await require('./tools/quality/analytics-live-actions.cjs').finish(github,context)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: analytics-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/analytics-live-results/
            ${{ runner.temp }}/analytics-live-input/target/binding.json
          if-no-files-found: error
          retention-days: 90
      - name: Keep the original failed collection red
        if: always() && steps.observe.outcome == 'failure'
        run: exit 1
  writing-attribution:
    if: github.event_name == 'pull_request' && github.event.label.name == 'site-writing-cause-evidence' && github.event.pull_request.number == 47 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SITE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - name: Install locked Node tools before source checks
        run: npm ci --prefix tools/quality/toolchain --ignore-scripts
      - name: Verify exact private attribution inputs
        run: |
          test "$(git rev-parse HEAD)" = "$SITE_CANDIDATE_SHA"
          node --test tests/cause-probe.test.cjs
          node - <<'JS'
          const root=process.env.RUNNER_TEMP+'/writing-cause-input';
          require('./tools/quality/artifact.cjs').build(root+'/color');
          require('./tools/staging/color.cjs').build(root+'/color');
          require('./tools/quality/writing-variants.cjs').derive(root+'/color',root+'/control','browser-gate-trace');
          JS
      - name: Bound Ubuntu downloads and use its primary archive
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          import re
          apt = Path('/etc/apt')
          sources = [apt / 'sources.list', *apt.glob('sources.list.d/*.list'), *apt.glob('sources.list.d/*.sources')]
          mirrors = {apt / 'apt-mirrors.txt'}
          for source in sources:
              if source.exists():
                  active = '\n'.join(line.split('#', 1)[0] for line in source.read_text().splitlines())
                  for name in re.findall(r'(?<!\S)mirror\+file:(?://)?(/etc/apt/[^\s#]+)', active):
                      mirror = Path(name)
                      if not mirror.resolve().is_relative_to(apt.resolve()) or not mirror.is_file():
                          raise ValueError('Invalid or missing active APT mirror list: ' + name)
                      mirrors.add(mirror)
          pattern = r'https?://azure\.archive\.ubuntu\.com/ubuntu(?=/|\s|$)'
          changed = []
          for source in [*sources, *sorted(mirrors)]:
              if not source.exists():
                  continue
              before = source.read_text()
              after = re.sub(pattern, 'https://archive.ubuntu.com/ubuntu', before)
              if after != before:
                  source.write_text(after)
                  changed.append(str(source))
              if re.search(pattern, source.read_text()):
                  raise ValueError('Azure archive remains in ' + str(source))
          (apt / 'apt.conf.d/99-site-download-bounds').write_text('Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "0";\n')
          print('Ubuntu source/mirror files moved to the primary archive:', changed)
          PYTHON
      - name: Install pinned Chromium only
        run: |
          tools/quality/toolchain/node_modules/.bin/playwright install-deps chromium
      - name: Restore verified pinned browsers without prior launch
        uses: ./.github/actions/browser-archive
        with:
          browsers: chromium
      - name: Retain four bounded Writing cause observations
        run: >-
          node tools/quality/cause-probe.cjs writing
          "$RUNNER_TEMP/writing-cause-input/color"
          "$RUNNER_TEMP/writing-cause-input/control"
          "$RUNNER_TEMP/writing-cause-results"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: writing-cause-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/writing-cause-results/
          if-no-files-found: error
          retention-days: 90
  writing-current:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.label.name == 'site-writing-current-evidence' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.number == 40 ||
       (github.event.pull_request.number == 128 &&
        github.event.sender.login == github.repository_owner && github.actor == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SITE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - name: Install locked Node tools before source checks
        run: npm ci --prefix tools/quality/toolchain --ignore-scripts
      - name: Verify exact private attribution inputs
        run: |
          test "$(git rev-parse HEAD)" = "$SITE_CANDIDATE_SHA"
          node --test tests/cause-probe.test.cjs
          node - <<'JS'
          const root=process.env.RUNNER_TEMP+'/writing-cause-input';
          require('./tools/quality/artifact.cjs').build(root+'/color');
          require('./tools/staging/color.cjs').build(root+'/color');
          require('./tools/quality/writing-variants.cjs').derive(root+'/color',root+'/control','browser-gate-trace');
          JS
      - name: Bound Ubuntu downloads and use its primary archive
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          import re
          apt = Path('/etc/apt')
          sources = [apt / 'sources.list', *apt.glob('sources.list.d/*.list'), *apt.glob('sources.list.d/*.sources')]
          mirrors = {apt / 'apt-mirrors.txt'}
          for source in sources:
              if source.exists():
                  active = '\n'.join(line.split('#', 1)[0] for line in source.read_text().splitlines())
                  for name in re.findall(r'(?<!\S)mirror\+file:(?://)?(/etc/apt/[^\s#]+)', active):
                      mirror = Path(name)
                      if not mirror.resolve().is_relative_to(apt.resolve()) or not mirror.is_file():
                          raise ValueError('Invalid or missing active APT mirror list: ' + name)
                      mirrors.add(mirror)
          pattern = r'https?://azure\.archive\.ubuntu\.com/ubuntu(?=/|\s|$)'
          changed = []
          for source in [*sources, *sorted(mirrors)]:
              if not source.exists():
                  continue
              before = source.read_text()
              after = re.sub(pattern, 'https://archive.ubuntu.com/ubuntu', before)
              if after != before:
                  source.write_text(after)
                  changed.append(str(source))
              if re.search(pattern, source.read_text()):
                  raise ValueError('Azure archive remains in ' + str(source))
          (apt / 'apt.conf.d/99-site-download-bounds').write_text('Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "0";\n')
          print('Ubuntu source/mirror files moved to the primary archive:', changed)
          PYTHON
      - name: Install pinned Chromium only
        run: |
          tools/quality/toolchain/node_modules/.bin/playwright install-deps chromium
      - name: Restore verified pinned browsers without prior launch
        uses: ./.github/actions/browser-archive
        with:
          browsers: chromium
      - name: Retain five ordinary Writing trials then one separately CPU-sampled trial
        run: >-
          node tools/quality/cause-probe.cjs writing-current
          "$RUNNER_TEMP/writing-cause-input/color"
          "$RUNNER_TEMP/writing-cause-input/control"
          "$RUNNER_TEMP/writing-cause-results"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: writing-current-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/writing-cause-results/
          if-no-files-found: error
          retention-days: 90
  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'analytics-live'
    strategy:
      fail-fast: false
      matrix:
        scope: [webkit, lighthouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SITE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - name: Install locked Node tools before source checks
        run: npm ci --prefix tools/quality/toolchain --ignore-scripts
      - name: Verify exact private inputs
        run: |
          node --test tests/cause-probe.test.cjs
          node - <<'JS'
          const root=process.env.RUNNER_TEMP+'/cause-input';
          require('./tools/quality/artifact.cjs').build(root+'/color');
          require('./tools/staging/color.cjs').build(root+'/color');
          require('./tools/quality/writing-variants.cjs').derive(root+'/color',root+'/control','browser-gate-trace');
          JS
      - name: Install pinned browser tools
        run: |
          tools/quality/toolchain/node_modules/.bin/playwright install-deps chromium firefox webkit
      - name: Restore verified pinned browsers without prior launch
        uses: ./.github/actions/browser-archive
        with:
          browsers: chromium,firefox,webkit
      - name: Retain original failures and function-level profiles
        run: >-
          node tools/quality/cause-probe.cjs ${{ matrix.scope }}
          "$RUNNER_TEMP/cause-input/color"
          "$RUNNER_TEMP/cause-input/control"
          "$RUNNER_TEMP/cause-results"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: cause-diagnostic-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cause-results/
          if-no-files-found: error
          retention-days: 90
