name: Optional full production diagnostics
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate for optional full production automation preflight
        required: true
        type: string
      base_url:
        description: Immutable HTTPS preview of the prospective production bytes
        required: true
        type: string
      public_artifact_id:
        description: Frozen prospective production artifact, without STAGING edition
        required: true
        type: string
      public_run_id:
        description: Run that uploaded the frozen public artifact
        required: true
        type: string
      public_digest:
        description: Exact public file manifest SHA256
        required: true
        type: string
      public_upload_digest:
        description: GitHub upload archive SHA256
        required: true
        type: string
      scan_live_production:
        description: Include the existing bounded passive ZAP scan on the canonical live origin
        required: true
        default: true
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    uses: ./.github/workflows/site-release-checks.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      validation_level: production
      automated_only: true
      full: true
      profile: staging
      base_url: ${{ inputs.base_url }}
      public_variant: color
      public_artifact_id: ${{ inputs.public_artifact_id }}
      public_run_id: ${{ inputs.public_run_id }}
      public_digest: ${{ inputs.public_digest }}
      public_upload_digest: ${{ inputs.public_upload_digest }}
  passive:
    if: github.actor == github.repository_owner && inputs.scan_live_production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Preserve the full diagnostic passive scan and finding policy
        run: |
          mkdir -p quality-reports/zap
          node tools/release/passive.cjs plan quality-reports/zap/plan.json
          chmod 777 quality-reports/zap
          docker run --rm --network bridge -v "$GITHUB_WORKSPACE/quality-reports/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2 zap.sh -cmd -autorun /zap/wrk/plan.json
          node tools/release/passive.cjs verify quality-reports/zap/zap.json quality-reports/passive.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: site-production-passive-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-reports/
          if-no-files-found: error
          retention-days: 90
