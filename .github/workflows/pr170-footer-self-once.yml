name: PR170 temporary native footer runtime verification
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  source-and-generated:
    if: >-
      ${{ github.event.pull_request.number == 170 &&
          github.repository == 'oborskyivitalii/oborskyivitalii' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'work/issue-169-sdlc-out-of-balance-plan' &&
          github.actor == 'oborskyivitalii' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.14
      - name: Test native footer box without changing motion budget, regenerate from authored source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rm .github/workflows/pr170-footer-self-once.yml
          git add -A -- .github/workflows/pr170-footer-self-once.yml
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          npm ci --prefix tools/publishing/toolchain --ignore-scripts
          python3 -m venv tools/quality/toolchain/venv
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check --no-deps ruff==0.16.10 PyYAML==6.0.3 packaging==26.3
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check --no-deps "$(python3 tools/publishing/web-media.py --requirement)"
          node tools/quality/toolchain/node_modules/prettier/bin/prettier.cjs --config tools/quality/prettier.config.json --write site/engine/scroll-entry.cjs tests/scroll-entry.test.cjs
          node --test tests/scroll-entry.test.cjs tests/article-browser-evidence.test.cjs
          node tools/site/build.cjs --all
          node tools/site/build.cjs --check
          python3 - <<'PY'
          import json,pathlib,re
          catalog=pathlib.Path('.github/repository-paths.json')
          data=json.loads(catalog.read_text())
          entries=data['entries']
          allowed=re.compile(r'^docs/(?:article-media|article-snapshots|snapshots|runtime)/[a-f0-9]{64}(?:/[A-Za-z0-9._-]+)?$')
          new_paths=[]
          for path in sorted(pathlib.Path('docs').rglob('*')):
              rel=path.as_posix()
              if rel in entries:continue
              if not allowed.fullmatch(rel):
                  raise SystemExit('Unclassified generated path: '+rel)
              entries[rel]={'kind':'directory' if path.is_dir() else 'file','purpose':'Generated current R4 runtime and immutable article assets from authored site sources.','role':'generated','owner':'site/README.md'}
              new_paths.append(rel)
          # These six former CURRENT (not approved historic) snapshots were
          # replaced by the verified new R4 runtime; generated paths only.
          removed_files=[
              'docs/article-snapshots/ac790b715c322b200c52f0cb1655e862b4ab35734cb7cda535030586d8a10c94/the-sdlc-is-out-of-balance.html',
              'docs/snapshots/2985c6b9d0da790cc8ac8bdd3633022f0073b5caa5a9eee10a7df3e5f2827d5e/credits.html',
              'docs/snapshots/2b564ce672cf59242a916d3c072726d8157ee44b8cbb3b17aef07e74a0d511d9/index.html',
              'docs/snapshots/48656c32211fd72d8db6fc2b4ae8e351c54e21e8c5b0c7bd2708942711dbd09f/research.html',
              'docs/snapshots/9238da25002c4ddd6d0636aa3e670a797b5d43c6441fcd0749f2530b6992f731/talks.html',
              'docs/snapshots/dbf73764485e5bd4aefd058726ee3a0ea75c8b7421da874d5df9ad442c9ceaa0/writing.html',
          ]
          frozen=json.loads(pathlib.Path('site/retained/manifest.json').read_text())['files']
          rights=json.loads(pathlib.Path('site/rights.json').read_text())['retained']
          for name in removed_files:
              relative=name.removeprefix('docs/')
              if relative in frozen or relative in rights:
                  raise SystemExit('Cannot retire declared historical content: '+name)
              record=entries.get(name)
              if not record or record.get('role')!='generated' or record.get('kind')!='file' or pathlib.Path(name).exists():
                  raise SystemExit('Unexpected generated file retirement: '+name)
              del entries[name]
              parent=name.rsplit('/',1)[0]
              if any(path.startswith(parent+'/') for path in entries):
                  raise SystemExit('Retired directory still contains indexed files: '+parent)
              folder=entries.get(parent)
              if not folder or folder.get('role')!='generated' or folder.get('kind')!='directory' or pathlib.Path(parent).exists():
                  raise SystemExit('Unexpected generated directory retirement: '+parent)
              del entries[parent]
          missing=[path for path,v in entries.items() if path.startswith('docs/') and v.get('role')=='generated' and not pathlib.Path(path).exists()]
          if missing:
              raise SystemExit('Additional unreviewed generated deletion: '+repr(missing[:15]))
          data['entries']={k:entries[k] for k in sorted(entries)}
          catalog.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          print('Added generated paths',len(new_paths))
          PY
          python3 tools/check_ri_ci.py refresh
          node tools/quality/toolchain/node_modules/prettier/bin/prettier.cjs --config tools/quality/prettier.config.json --write .github/ri-ci-map.json
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json build
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json verify
          python3 tools/check_ri_ci.py verify
          node tools/quality/format.cjs --check
          git diff --check
          git add -A -- site/engine/scroll-entry.cjs tests/scroll-entry.test.cjs docs site/output-lock.json .github/repository-paths.json .github/ri-ci-map.json REPOSITORY-MAP.md .github/repository-intelligence/agent-context.json
          git diff --cached --stat
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: verify native footer route and regenerate R4 runtime/RI (Refs #169)"
          git push origin HEAD:refs/heads/work/issue-169-sdlc-out-of-balance-plan
