name: PR170 one-time accepted R4 PDF import
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  import-reviewed-r4:
    if: >-
      ${{ github.event.pull_request.number == 170 &&
          github.repository == 'oborskyivitalii/oborskyivitalii' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'work/issue-169-sdlc-out-of-balance-plan' &&
          github.actor == 'oborskyivitalii' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Verify immutable R4 archive, select exact reviewed PDF and remove helper
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git branch --show-current)" = "HEAD" || true
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 180 \
            --proto '=https' --tlsv1.2 \
            'https://github.com/user-attachments/files/34235255/r4-exploratory-evidence.tar.gz' \
            --output "${RUNNER_TEMP}/pr170-r4-exploratory.tar.gz"
          echo "dfb2253bfe1e9667ca1fa5f864b91bfe919cfd02994ed522e8ef1d4111f7b2d5  ${RUNNER_TEMP}/pr170-r4-exploratory.tar.gz" | sha256sum --check --status
          python3 - <<'PY'
          import hashlib, io, os, pathlib, tarfile
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr170-r4-exploratory.tar.gz'
          dest=pathlib.Path('site/assets/publications/sdlc-out-of-balance/materials/reading.pdf')
          expected='be35778ef93948ca7e809b7917faf1771d11e670e327a0dfc49d95ab4cfc2d98'
          matches=[]
          with tarfile.open(archive, 'r:gz') as tf:
              members=tf.getmembers()
              if len(members)>300: raise SystemExit('Unexpected R4 archive member count')
              for m in members:
                  if not m.isfile() or m.size>2000000 or not m.name.lower().endswith('.pdf'):
                      continue
                  with tf.extractfile(m) as stream:
                      data=stream.read(2000001)
                  if len(data)>2000000:
                      continue
                  if hashlib.sha256(data).hexdigest()==expected:
                      matches.append((m.name,data))
          if len(matches)!=1:
              raise SystemExit('Expected exactly one R4 PDF with the verified SHA256; got '+str(len(matches)))
          name,data=matches[0]
          if not data.startswith(b'%PDF-'):
              raise SystemExit('Selected PDF has invalid header')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_bytes(data)
          print('Imported exact reviewed R4 PDF:',name,len(data),expected)
          PY
          rm -- .github/workflows/pr170-r4-import-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/assets/publications/sdlc-out-of-balance/materials/reading.pdf .github/workflows/pr170-r4-import-once.yml
          git commit -m "content: import immutable reviewed R4 PDF (Refs #169)"
          git push origin HEAD:refs/heads/work/issue-169-sdlc-out-of-balance-plan
