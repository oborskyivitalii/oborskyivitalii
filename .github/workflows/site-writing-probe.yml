name: Issue122 frozen desktop edge geometry diagnostic
# Diagnostic branch only. Never merge this overlay; original staging failure remains.
on:
  push:
    branches: [work/issue-122-writing-startup-diagnostic-20261026]
permissions:
  contents: read
  actions: read
jobs:
  startup:
    if: github.repository == 'oborskyivitalii/oborskyivitalii' && github.actor == 'oborskyivitalii' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 1e1617d63b7e1677d868e5612926f9bcf60007bc
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Initialize private diagnostic paths at runtime
        run: |
          python3 - <<'PYTHON'
          import os
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for key,leaf in [('GEOMETRY_DIAGNOSTIC_PACKAGE','geometry-package'),('GEOMETRY_DIAGNOSTIC_OUTPUT','desktop-geometry')]:
                  f.write(key+'='+os.path.join(os.environ['RUNNER_TEMP'],leaf)+'\n')
          PYTHON
      - name: Authenticate retained failed-preview package metadata
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const a=require('node:assert/strict');
            const meta=(await github.rest.actions.getArtifact({...context.repo,artifact_id:12686584691})).data;
            a.equal(meta.expired,false);
            a.equal(meta.name,'site-review-package-40398934425-1');
            a.equal(meta.size_in_bytes,708285);
            a.equal(meta.digest,'sha256:add7472142c1a323139fe3e221388deeb26c66930782faf757f5805859d8ca6b');
            a.equal(meta.workflow_run.id,40398934425);
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:40398934425})).data;
            a.equal(run.path,'.github/workflows/site-color-review.yml');
            a.equal(run.head_sha,'1e1617d63b7e1677d868e5612926f9bcf60007bc');
            a.equal(run.run_attempt,1);
            a.equal(run.event,'pull_request');
            a.ok(run.pull_requests.some(pr=>pr.number===151));
            a.equal(run.actor.login,'oborskyivitalii');
            a.equal(run.status,'completed');
            a.equal(run.conclusion,'failure');
            core.info('Original failed-preview package identity authenticated; failure retained.');
      - name: Download original ZIP and verify native digest before extraction
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import importlib.util,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['GEOMETRY_DIAGNOSTIC_PACKAGE']);root.mkdir()
          s=importlib.util.spec_from_file_location('archive','tools/quality/browser_archives.py')
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          p=root.parent/'geometry-package-original.zip'
          m.download({'artifact':12686584691,'uploadDigest':'sha256:add7472142c1a323139fe3e221388deeb26c66930782faf757f5805859d8ca6b'},os.environ['GITHUB_TOKEN'],p)
          assert p.stat().st_size==708285
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert all(not pathlib.Path(n).is_absolute() and '..' not in pathlib.Path(n).parts for n in z.namelist())
              z.extractall(root)
          print('Original package native size/SHA/CRC verified.')
          PYTHON
      - name: Bound Ubuntu downloads and use its primary archive
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          import re
          apt = Path('/etc/apt')
          sources = [apt / 'sources.list', *apt.glob('sources.list.d/*.list'), *apt.glob('sources.list.d/*.sources')]
          mirrors = {apt / 'apt-mirrors.txt'}
          for source in sources:
              if source.exists():
                  active = '\n'.join(line.split('#', 1)[0] for line in source.read_text().splitlines())
                  for name in re.findall(r'(?<!\S)mirror\+file:(?://)?(/etc/apt/[^\s#]+)', active):
                      mirror = Path(name)
                      if not mirror.resolve().is_relative_to(apt.resolve()) or not mirror.is_file():
                          raise ValueError('Invalid or missing active APT mirror list: ' + name)
                      mirrors.add(mirror)
          pattern = r'https?://azure\.archive\.ubuntu\.com/ubuntu(?=/|\s|$)'
          changed = []
          for source in [*sources, *sorted(mirrors)]:
              if not source.exists():
                  continue
              before = source.read_text()
              after = re.sub(pattern, 'https://archive.ubuntu.com/ubuntu', before)
              if after != before:
                  source.write_text(after)
                  changed.append(str(source))
              if re.search(pattern, source.read_text()):
                  raise ValueError('Azure archive remains in ' + str(source))
          (apt / 'apt.conf.d/99-site-download-bounds').write_text('Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "0";\n')
          print('Ubuntu source/mirror files moved to the primary archive:', changed)
          PYTHON
      - name: Install existing locked tools and browser OS dependencies
        run: |
          test "$(git rev-parse HEAD)" = 1e1617d63b7e1677d868e5612926f9bcf60007bc
          test -z "$(git status --porcelain)"
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          tools/quality/toolchain/node_modules/.bin/playwright install-deps chromium
      - name: Restore existing authenticated pinned Chromium without prior launch
        uses: ./candidate/.github/actions/browser-archive
        with:
          browsers: chromium
          working-directory: candidate
      - name: Observe one original desktop Color scenario without changing its guards
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const cp = require('node:child_process');
          const assert = require('node:assert/strict');
          const root = process.cwd();
          const output = process.env.GEOMETRY_DIAGNOSTIC_OUTPUT;
          const packageRoot = process.env.GEOMETRY_DIAGNOSTIC_PACKAGE;
          const source = '1e1617d63b7e1677d868e5612926f9bcf60007bc';
          const tree = '4e370a6c94a5704fcf47368bcbb0838439de7567';
          const origin = 'https://6aca6f5e.oborskyi-author-ci-staging.pages.dev';
          const record = {
            kind: 'frozen-desktop-edge-geometry-diagnostic',
            source,
            tree,
            controller: process.env.GITHUB_SHA,
            run: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            packageArtifact: 12686584691,
            packageUploadDigest: 'sha256:add7472142c1a323139fe3e221388deeb26c66930782faf757f5805859d8ca6b',
            origin,
            acceptance: false,
            fullGate: false,
            completed: false,
            launches: 0,
            host: [],
            steps: [],
            pages: [],
            collectionErrors: [],
            scenario: { settled: false, pass: false },
            cleanup: { contexts: [], browser: false },
          };
          function identity() {
            const git = (...args) => cp.execFileSync('git', args, { encoding: 'utf8' }).trim();
            return {
              commit: git('rev-parse', 'HEAD'),
              tree: git('rev-parse', 'HEAD^{tree}'),
              dirty: git('status', '--porcelain'),
            };
          }
          function save() {
            fs.mkdirSync(output, { recursive: true });
            const bytes = JSON.stringify(record, null, 2) + '\n';
            assert.ok(Buffer.byteLength(bytes) <= 8 * 1024 * 1024, 'diagnostic output exceeds8MiB');
            fs.writeFileSync(path.join(output, 'geometry.json'), bytes);
          }
          function observer() {
            const data = {
              frames: 0,
              changes: [],
              events: [],
              errors: [],
              truncated: false,
            };
            window.__edgeGeometryDiagnostic = data;
            const rect = (node) => {
              if (!node) return null;
              const r = node.getBoundingClientRect();
              return {
                top: r.top,
                bottom: r.bottom,
                height: r.height,
                offsetHeight: node.offsetHeight,
                scrollHeight: node.scrollHeight,
              };
            };
            function snapshot(label) {
              const animations = document
                .getAnimations()
                .filter((a) => a.playState === 'running' || a.pending);
              const active = animations.slice(0, 32).map((a) => {
                const target = a.effect?.target;
                return {
                  name: a.animationName || null,
                  playState: a.playState,
                  pending: a.pending,
                  currentTime: a.currentTime,
                  timing: a.effect?.getComputedTiming(),
                  target: target
                    ? {
                        tag: target.tagName,
                        id: target.id,
                        classes: target.className,
                        dataset: { ...target.dataset },
                        rect: rect(target),
                      }
                    : null,
                };
              });
              return {
                label,
                time: performance.now(),
                route: document.body?.dataset.page || null,
                range: Math.max(0, document.documentElement.scrollHeight - innerHeight),
                y: scrollY,
                fonts: document.fonts?.status || null,
                hidden: document.hidden,
                main: rect(document.querySelector('main')),
                footer: rect(document.querySelector('footer')),
                root: rect(document.documentElement),
                reading: window.SiteScrollEntry?.diagnostics?.() || null,
                activeAnimations: animations.length,
                animations: active,
              };
            }
            window.__edgeGeometrySnapshot = snapshot;
            const event = (label, extra = {}) => {
              if (data.events.length >= 100) {
                data.truncated = true;
                return;
              }
              try {
                data.events.push({ ...snapshot(label), ...extra });
              } catch (error) {
                if (data.errors.length < 20) data.errors.push(String(error));
                else data.truncated = true;
              }
            };
            window.addEventListener(
              'wheel',
              (e) => event('wheel', { trusted: e.isTrusted, deltaY: e.deltaY }),
              { passive: true }
            );
            for (const name of ['loading', 'loadingdone', 'loadingerror'])
              document.fonts?.addEventListener(name, () => event('fonts-' + name));
            document.addEventListener('DOMContentLoaded', () => event('dom-ready'), {
              once: true,
            });
            window.addEventListener('load', () => event('load'), { once: true });
            let prior = null;
            function tick() {
              try {
                if (++data.frames > 6000) {
                  data.truncated = true;
                  return;
                }
                const route = document.body?.dataset.page || null;
                const range = Math.max(0, document.documentElement.scrollHeight - innerHeight);
                const key = route + ':' + range;
                if (key !== prior) {
                  if (data.changes.length >= 300) {
                    data.truncated = true;
                    return;
                  }
                  data.changes.push(snapshot('range-change'));
                  prior = key;
                }
              } catch (error) {
                data.errors.push(String(error));
                return;
              }
              requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
          }
          async function main() {
            record.sourceBefore = identity();
            assert.deepEqual(record.sourceBefore, { commit: source, tree, dirty: '' });
            const bundle = JSON.parse(fs.readFileSync(path.join(packageRoot, 'staging-package.json')));
            assert.equal(require(root + '/tools/staging/package.cjs').verify(packageRoot, bundle), true);
            assert.equal(bundle.source.sourceCommit, source);
            assert.equal(bundle.source.sourceTree, tree);
            assert.deepEqual(bundle.source.articleCandidates, []);
            record.artifactDigest = bundle.source.artifactDigest;
            process.env.SITE_PUBLIC_DIR = path.join(packageRoot, 'public');
            process.env.SITE_ARTIFACT_MANIFEST = path.join(output, 'frozen-artifact.json');
            process.env.SITE_TEST_BASE_URL = origin;
            process.env.SITE_TEST_PROFILE = 'preview';
            fs.mkdirSync(output, { recursive: true });
            fs.writeFileSync(process.env.SITE_ARTIFACT_MANIFEST, JSON.stringify(bundle.source));
            const revision = JSON.parse(fs.readFileSync(path.join(packageRoot, 'public/site-revision.json')));
            const runtimeFiles = ['styles.css', 'theme.js', 'space.js', 'archive.js', 'navigation.js'];
            const hostedFiles = new Set([
              'index.html',
              'research.html',
              'writing.html',
              'credits.html',
              'site-revision.json',
              ...runtimeFiles,
              ...runtimeFiles.map((name) => 'runtime/' + bundle.source.variant.fingerprint + '/' + name),
              ...Object.values(revision.routes).map((route) => route.url),
            ]);
            assert.equal(hostedFiles.size, 20, 'finite current hosted inventory');
            const hosted = require(root + '/tools/staging/hosted.cjs');
            for (const name of hostedFiles) {
              const signal = AbortSignal.timeout(10000);
              const result = await hosted.request(origin + '/' + name, origin, (target, options) =>
                fetch(target, { ...options, signal })
              );
              assert.equal(result.response.status, 200);
              if (name.startsWith('snapshots/')) assert.equal(result.redirects, 0);
              const sha = crypto.createHash('sha256').update(result.bytes).digest('hex');
              assert.equal(sha, bundle.files[name].sha256, 'frozen hosted bytes: ' + name);
              record.host.push({ name, sha, url: result.url, redirects: result.redirects });
            }
            const { toolRequire, environment, launchOptions } = require(root + '/tools/quality/common.cjs');
            record.environment = environment();
            const edge = require(root + '/tools/quality/edge-input.cjs');
            const color = require(root + '/tools/quality/color-browser.cjs');
            const pw = toolRequire('playwright');
            let browser;
            let timer;
            const capture = async (page, label) => {
              try {
                const snapshot = await page.evaluate(
                  (label) => window.__edgeGeometrySnapshot?.(label) || null,
                  label
                );
                assert.ok(
                  snapshot &&
                    typeof snapshot.route === 'string' &&
                    snapshot.route.length > 0 &&
                    Number.isFinite(snapshot.time) &&
                    Number.isFinite(snapshot.range),
                  'missing direct geometry/route snapshot'
                );
                return snapshot;
              } catch (error) {
                record.collectionErrors.push({ label, error: error.stack });
                return null;
              }
            };
            try {
              browser = await pw.chromium.launch(launchOptions('chromium'));
              record.launches++;
              record.browser = browser.version();
              const instrumented = {
                async newContext(options) {
                  const context = await browser.newContext(options);
                  await context.addInitScript(observer);
                  return {
                    addInitScript: (...args) => context.addInitScript(...args),
                    async newPage() {
                      const page = await context.newPage();
                      return new Proxy(page, {
                        get(target, key) {
                          if (key === 'evaluate')
                            return async (fn, args) => {
                              if (fn !== edge.observe) return target.evaluate(fn, args);
                              const step = {
                                id: record.steps.length + 1,
                                direction: args.direction,
                                before: await capture(target, 'prepare-before'),
                              };
                              record.steps.push(step);
                              try {
                                const result = await target.evaluate(fn, args);
                                step.result = result;
                                return result;
                              } catch (error) {
                                step.error = error.stack;
                                throw error;
                              } finally {
                                step.after = await capture(target, 'prepare-after');
                              }
                            };
                          const value = target[key];
                          return typeof value === 'function' ? value.bind(target) : value;
                        },
                      });
                    },
                    async close() {
                      try {
                        for (const page of context.pages()) {
                          try {
                            record.pages.push(
                              await page.evaluate(() => ({
                                final: window.__edgeGeometrySnapshot?.('context-close'),
                                observation: window.__edgeGeometryDiagnostic,
                              }))
                            );
                          } catch (error) {
                            record.collectionErrors.push({
                              label: 'context-close',
                              error: error.stack,
                            });
                          }
                        }
                      } finally {
                        try {
                          await context.close();
                          record.cleanup.contexts.push(true);
                        } catch (error) {
                          record.cleanup.contexts.push(false);
                          record.collectionErrors.push({
                            label: 'context-cleanup',
                            error: error.stack,
                          });
                        }
                      }
                    },
                  };
                },
              };
              const scenario = color.scenario(instrumented, origin, bundle.source, 'chromium', 1440, 'light');
              scenario.catch(() => {});
              try {
                record.scenario.result = await Promise.race([
                  scenario,
                  new Promise((_, reject) => {
                    timer = setTimeout(() => {
                      record.scenario.timedOut = true;
                      reject(Error('diagnostic scenario75s deadline'));
                    }, 75000);
                  }),
                ]);
                record.scenario.pass = true;
              } catch (error) {
                record.scenario.error = error.stack;
                record.scenario.edgeInput = error.edgeInput || null;
              } finally {
                clearTimeout(timer);
                record.scenario.settled = !record.scenario.timedOut;
              }
            } catch (error) {
              record.primaryError = error.stack;
              throw error;
            } finally {
              if (browser) {
                try {
                  await browser.close();
                  record.cleanup.browser = true;
                } catch (error) {
                  record.collectionErrors.push({
                    label: 'browser-cleanup',
                    error: error.stack,
                  });
                }
              }
              try {
                record.sourceAfter = identity();
                assert.deepEqual(record.sourceAfter, record.sourceBefore);
              } catch (error) {
                record.collectionErrors.push({ label: 'source-after', error: error.stack });
              }
              record.completed =
                record.scenario.settled &&
                record.steps.length > 0 &&
                record.steps.every((step) => step.before?.route && step.after?.route) &&
                record.pages.length > 0 &&
                record.pages.every(
                  (p) =>
                    p?.final?.route &&
                    Number.isFinite(p.final.time) &&
                    Number.isFinite(p.final.range) &&
                    p?.observation &&
                    !p.observation.truncated &&
                    p.observation.errors.length === 0
                ) &&
                record.collectionErrors.length === 0 &&
                record.cleanup.browser &&
                record.cleanup.contexts.length === 1 &&
                record.cleanup.contexts[0];
              save();
            }
            assert.equal(record.completed, true, 'geometry diagnostic incomplete');
            console.log(
              JSON.stringify({
                completed: record.completed,
                scenarioPass: record.scenario.pass,
                launches: record.launches,
                steps: record.steps.length,
                acceptance: false,
              })
            );
          }
          main().catch((error) => {
            record.completed = false;
            const causes = [];
            let cause = error.cause;
            for (let i = 0; cause && i < 4; i++, cause = cause.cause)
              causes.push({
                name: String(cause.name),
                message: String(cause.message),
                code: cause.code || null,
              });
            record.collectionErrors.push({ label: 'main', error: error.stack, causes });
            try {
              save();
            } catch (saveError) {
              console.error(saveError.stack);
            }
            console.error(error.stack);
            process.exitCode = 1;
          });
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: issue122-desktop-geometry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-geometry/
          if-no-files-found: warn
          retention-days: 30
