name: Writing cold comparison
# Historical Writing diagnostics remain manual. Issue #36 evidence requires
# an explicit label event; ordinary PR updates keep fast checks.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current candidate commit
        required: true
        type: string
      diagnosis:
        description: Run the dated bounded diagnosis instead of the original PR23 comparison
        required: false
        default: false
        type: boolean
      localization:
        description: Replay the dated Writing localization or supported-fix confirmation
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: writing-comparison-${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
    working-directory: candidate
jobs:
  reading-clarity:
    if: github.event_name == 'pull_request' && github.event.label.name == 'site-reading-clarity-evidence' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      READING_BASELINE_SHA: 76f2a786a016c8f40230e3d23b14f7ee36c16a57
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 76f2a786a016c8f40230e3d23b14f7ee36c16a57
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Verify source and generated inputs once
        run: |
          test "$(git rev-parse HEAD)" = "$SITE_CANDIDATE_SHA"
          test "$(git -C ../baseline rev-parse HEAD)" = "$READING_BASELINE_SHA"
          node tools/site/build.cjs --check
          node ../baseline/tools/site/build.cjs --check
          node tools/quality/artifact.cjs build "$RUNNER_TEMP/clarity-input/candidate"
          node tools/staging/color.cjs "$RUNNER_TEMP/clarity-input/candidate"
          SITE_CANDIDATE_SHA="$READING_BASELINE_SHA" node ../baseline/tools/quality/artifact.cjs build "$RUNNER_TEMP/clarity-input/baseline"
          node ../baseline/tools/staging/color.cjs "$RUNNER_TEMP/clarity-input/baseline"
      - name: Bound Ubuntu downloads and use its primary archive
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          import re
          apt = Path('/etc/apt')
          sources = [apt / 'sources.list', *apt.glob('sources.list.d/*.list'), *apt.glob('sources.list.d/*.sources')]
          mirrors = {apt / 'apt-mirrors.txt'}
          for source in sources:
              if source.exists():
                  active = '\n'.join(line.split('#', 1)[0] for line in source.read_text().splitlines())
                  for name in re.findall(r'(?<!\S)mirror\+file:(?://)?(/etc/apt/[^\s#]+)', active):
                      mirror = Path(name)
                      if not mirror.resolve().is_relative_to(apt.resolve()) or not mirror.is_file():
                          raise ValueError('Invalid or missing active APT mirror list: ' + name)
                      mirrors.add(mirror)
          pattern = r'https?://azure\.archive\.ubuntu\.com/ubuntu(?=/|\s|$)'
          changed = []
          for source in [*sources, *sorted(mirrors)]:
              if not source.exists():
                  continue
              before = source.read_text()
              after = re.sub(pattern, 'https://archive.ubuntu.com/ubuntu', before)
              if after != before:
                  source.write_text(after)
                  changed.append(str(source))
              if re.search(pattern, source.read_text()):
                  raise ValueError('Azure archive remains in ' + str(source))
          (apt / 'apt.conf.d/99-site-download-bounds').write_text('Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "0";\n')
          print('Ubuntu source/mirror files moved to the primary archive:', changed)
          PYTHON
      - name: Install pinned Chromium only
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          tools/quality/toolchain/node_modules/.bin/playwright install --with-deps chromium
      - name: Check heading geometry, formula and bounded ribbon flights
        run: node tools/quality/reading-clarity.cjs "$RUNNER_TEMP/clarity-input/candidate/public" "$RUNNER_TEMP/clarity-input/baseline/public" "$RUNNER_TEMP/reading-clarity"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: reading-clarity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reading-clarity/
          if-no-files-found: error
          retention-days: 30
  writing:
    if: github.event_name == 'workflow_dispatch' && !inputs.diagnosis && !inputs.localization
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      WRITING_REFERENCE_SHA: 174bef1f14390363953cc94ebc0ced136d39da82
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 174bef1f14390363953cc94ebc0ced136d39da82
          path: reference
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Package original PR23 base, current base and current Color
        run: |
          test "$(git rev-parse HEAD)" = "$SITE_CANDIDATE_SHA"
          SITE_CANDIDATE_SHA="$WRITING_REFERENCE_SHA" node ../reference/tools/quality/artifact.cjs build "$RUNNER_TEMP/writing-input/pr23-base"
          node tools/quality/artifact.cjs build "$RUNNER_TEMP/writing-input/current-base"
          node -e "const fs=require('node:fs'),p=process.env.RUNNER_TEMP+'/writing-input/';fs.cpSync(p+'current-base',p+'current-color',{recursive:true})"
          node tools/staging/color.cjs "$RUNNER_TEMP/writing-input/current-color"
      - name: Install pinned Chromium only
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          tools/quality/toolchain/node_modules/.bin/playwright install --with-deps chromium
      - name: Collect paired cold Writing evidence and retain every trial
        run: node tools/quality/writing-probe.cjs "$RUNNER_TEMP/writing-input" "$RUNNER_TEMP/writing-results"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: writing-cold-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/writing-results/
          if-no-files-found: error
          retention-days: 30
  diagnosis:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnosis && !inputs.localization
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      WRITING_BEFORE_SHA: 6b73399c4f0afeba497c92809686bba4b7a3200a
      WRITING_DIAGNOSIS_TRACE: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 6b73399c4f0afeba497c92809686bba4b7a3200a
          path: reference
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Check diagnostic helpers and package exact paired inputs
        run: |
          test "$(git rev-parse HEAD)" = "$SITE_CANDIDATE_SHA"
          node --test tests/writing-diagnosis.test.cjs tests/writing-variants.test.cjs
          SITE_CANDIDATE_SHA="$WRITING_BEFORE_SHA" node ../reference/tools/quality/artifact.cjs build "$RUNNER_TEMP/writing-input/before-color"
          node ../reference/tools/staging/color.cjs "$RUNNER_TEMP/writing-input/before-color"
          node tools/quality/artifact.cjs build "$RUNNER_TEMP/writing-input/current-base"
          node -e "const fs=require('node:fs'),p=process.env.RUNNER_TEMP+'/writing-input/';fs.cpSync(p+'current-base',p+'current-color',{recursive:true})"
          node tools/staging/color.cjs "$RUNNER_TEMP/writing-input/current-color"
          node tools/quality/writing-variants.cjs "$RUNNER_TEMP/writing-input"
      - name: Install pinned Chromium only
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          tools/quality/toolchain/node_modules/.bin/playwright install --with-deps chromium
      - name: Confirm the supported change with clean paired cold boots and flights
        run: node tools/quality/writing-diagnosis.cjs "$RUNNER_TEMP/writing-input" "$RUNNER_TEMP/writing-results" review/writing-diagnosis-20261006/run.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: writing-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/writing-results/
          if-no-files-found: error
          retention-days: 90

  paradigm:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'site-writing-paradigm-evidence' && github.event.pull_request.number == 38 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SITE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      WRITING_BASELINE_SHA: 11e5432d908ca0b81431ca4eac6721b076c33cb6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 11e5432d908ca0b81431ca4eac6721b076c33cb6
          path: reference
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Validate opt-in contract and package exact Color comparison
        id: inputs
        run: |
          test "$(git rev-parse HEAD)" = "$SITE_CANDIDATE_SHA"
          test "$(git -C ../reference rev-parse HEAD)" = "$WRITING_BASELINE_SHA"
          node --test tests/writing-paradigm-ci.test.cjs
          SITE_CANDIDATE_SHA="$WRITING_BASELINE_SHA" node ../reference/tools/quality/artifact.cjs build "$RUNNER_TEMP/writing-paradigm-input/baseline"
          node ../reference/tools/staging/color.cjs "$RUNNER_TEMP/writing-paradigm-input/baseline"
          node tools/quality/artifact.cjs build "$RUNNER_TEMP/writing-paradigm-input/candidate"
          node tools/staging/color.cjs "$RUNNER_TEMP/writing-paradigm-input/candidate"
      - name: Install pinned Linux browser engines
        id: browsers
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          tools/quality/toolchain/node_modules/.bin/playwright install --with-deps chromium firefox
      - name: Check Writing lifecycle and retain scene captures
        env:
          SITE_REPORT_DIR: ${{ runner.temp }}/writing-paradigm-results/browser
          SITE_AUDIT_LIFECYCLE: 'true'
          DEBUG: pw:browser
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/writing-paradigm-results/browser"
          node tools/quality/writing-paradigm-browser.cjs "$RUNNER_TEMP/writing-paradigm-input/candidate" "$RUNNER_TEMP/writing-paradigm-results/browser" 2>&1 | tee "$RUNNER_TEMP/writing-paradigm-results/browser/browser-run.log"
      - name: Measure three ordered pairs per profile without parallel browsers
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' && steps.browsers.outcome == 'success' }}
        run: node tools/quality/writing-paradigm.cjs "$RUNNER_TEMP/writing-paradigm-input" "$RUNNER_TEMP/writing-paradigm-results/performance"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: writing-paradigm-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/writing-paradigm-results/
          if-no-files-found: error
          retention-days: 90

  localization:
    if: github.event_name == 'workflow_dispatch' && inputs.localization
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      WRITING_BEFORE_SHA: 6d538e171ecbbaa3c3948aa0d8d118fad4aaaf5d
      WRITING_DIAGNOSIS_TRACE: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 6d538e171ecbbaa3c3948aa0d8d118fad4aaaf5d
          path: reference
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Check localization helpers and package exact controls
        run: |
          test "$(git rev-parse HEAD)" = "$SITE_CANDIDATE_SHA"
          node --test tests/writing-diagnosis.test.cjs tests/writing-variants.test.cjs tests/writing-layout.test.cjs tests/writing-models.test.cjs tests/writing-localization.test.cjs tests/writing-geometry.test.cjs tests/site-face-preparation.test.cjs tests/navigation.test.cjs tests/space.test.cjs
          SITE_CANDIDATE_SHA="$WRITING_BEFORE_SHA" node ../reference/tools/quality/artifact.cjs build "$RUNNER_TEMP/writing-input/before-color"
          node ../reference/tools/staging/color.cjs "$RUNNER_TEMP/writing-input/before-color"
          node tools/quality/artifact.cjs build "$RUNNER_TEMP/writing-input/current-base"
          node -e "const fs=require('node:fs'),p=process.env.RUNNER_TEMP+'/writing-input/';fs.cpSync(p+'current-base',p+'current-color',{recursive:true})"
          node tools/staging/color.cjs "$RUNNER_TEMP/writing-input/current-color"
          node tools/quality/writing-variants.cjs "$RUNNER_TEMP/writing-input"
      - name: Install locked Chromium only
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          tools/quality/toolchain/node_modules/.bin/playwright install --with-deps chromium
      - name: Localize Writing or confirm only the supported source correction
        run: |
          node - <<'JS'
          const fs=require('node:fs'),path=require('node:path');
          const input=process.env.RUNNER_TEMP+'/writing-input',out=process.env.RUNNER_TEMP+'/writing-results';
          const config=JSON.parse(fs.readFileSync('review/writing-diagnosis-20261006/localization-run.json'));
          const driver=config.mode==='v0'?require('./tools/quality/writing-diagnosis.cjs'):require('./tools/quality/writing-localization.cjs');
          (async()=>{
            await driver.main(input,out,config);
            if(config.mode==='v0'){
              const {serve}=require('./tools/quality/writing-probe.cjs');
              const inputs=Object.fromEntries(['before-color','current-color'].map(label=>[label,{publicDir:path.join(input,label,'public')}]));
              const {server,url}=await serve(inputs);
              try{await require('./tools/quality/writing-geometry.cjs').compare(url+'/before-color',url+'/current-color',out+'/geometry.json');}
              finally{server.close();}
            }
          })().catch(error=>{console.error(error.stack);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: writing-localization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/writing-results/
          if-no-files-found: error
          retention-days: 90
