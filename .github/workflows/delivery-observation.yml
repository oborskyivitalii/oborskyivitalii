name: Delivery routing observation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  observe:
    name: Non-authoritative delivery observation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OBSERVATION_BASE: ${{ github.event.pull_request.base.sha }}
      OBSERVATION_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Observe candidate policy without granting delivery authority
        run: node tools/quality/delivery-observation.cjs --base "$OBSERVATION_BASE" --head "$OBSERVATION_HEAD" --policy "$OBSERVATION_HEAD" --out "$RUNNER_TEMP/delivery-observation"
      - name: Retain observation and original collector bytes even after failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: delivery-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delivery-observation/
          if-no-files-found: error
          retention-days: 30
