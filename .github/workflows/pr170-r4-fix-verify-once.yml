name: PR170 R4 bounded source correction verification
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  corrected-source:
    if: >-
      ${{ github.event.pull_request.number == 170 &&
          github.repository == 'oborskyivitalii/oborskyivitalii' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'work/issue-169-sdlc-out-of-balance-plan' &&
          github.actor == 'oborskyivitalii' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.14
      - name: Format only touched source; refresh RI and run exact corrected-source tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rm .github/workflows/pr170-r4-fix-verify-once.yml
          git add -A -- .github/workflows/pr170-r4-fix-verify-once.yml
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          npm ci --prefix tools/publishing/toolchain --ignore-scripts
          python3 -m venv tools/quality/toolchain/venv
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check --no-deps ruff==0.16.10 PyYAML==6.0.3 packaging==26.3
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check --no-deps "$(python3 tools/publishing/web-media.py --requirement)"
          node tools/quality/toolchain/node_modules/prettier/bin/prettier.cjs --config tools/quality/prettier.config.json --write \
            tools/staging/color.cjs tests/edition-retention.test.cjs \
            tests/publication-records.test.cjs tests/release-rights.test.cjs \
            tools/quality/article-browser.cjs tests/article-browser-evidence.test.cjs
          python3 tools/check_ri_ci.py refresh
          node tools/quality/toolchain/node_modules/prettier/bin/prettier.cjs --config tools/quality/prettier.config.json --write .github/ri-ci-map.json
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json build
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json verify
          python3 tools/check_ri_ci.py verify
          node tools/quality/format.cjs --check
          git diff --check
          node --test --test-concurrency=4 \
            tests/edition-retention.test.cjs tests/publication-records.test.cjs \
            tests/release-rights.test.cjs tests/release-controller.test.cjs \
            tests/article-browser-evidence.test.cjs
          git add -A -- tools/staging/color.cjs tests/edition-retention.test.cjs \
            tests/publication-records.test.cjs tests/release-rights.test.cjs \
            tools/quality/article-browser.cjs tests/article-browser-evidence.test.cjs \
            .github/ri-ci-map.json \
            REPOSITORY-MAP.md .github/repository-intelligence/agent-context.json
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "test: confirm corrected R4 provenance, runtime and browser evidence (Refs #169)"
          git push origin HEAD:refs/heads/work/issue-169-sdlc-out-of-balance-plan
