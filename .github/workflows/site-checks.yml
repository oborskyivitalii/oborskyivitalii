name: Site basic checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact protected-main tip (manual staging source)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  checks:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Prototype source admission deferred' || 'checks' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.public.outputs.artifact-id }}
      artifact_upload_digest: ${{ steps.public.outputs.artifact-digest }}
      public_digest: ${{ steps.identity.outputs.digest }}
      gate_artifact_id: ${{ steps.gate.outputs.artifact-id }}
      gate_upload_digest: ${{ steps.gate.outputs.artifact-digest }}
    env:
      SITE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      SITE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Select work with the protected-base classifier
        id: selection
        env:
          SOURCE_EVENT: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const path = require('node:path');
          const head = process.env.SITE_CANDIDATE_SHA;
          if (!/^[a-f0-9]{40}$/.test(head)) throw Error('Exact candidate SHA required');
          cp.execFileSync('git', ['fetch', '--no-tags', 'origin', head]);
          const select = require('./tools/quality/delivery-observation.cjs').selection;
          const plan = process.env.SOURCE_EVENT === 'pull_request' && select
            ? select(process.cwd(), process.env.SITE_BASE_SHA, head)
            : { repositoryOnly: false, reason: 'Existing full route / enabling bootstrap' };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'delivery-selection.json'), JSON.stringify(plan, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'repository_only=' + plan.repositoryOnly + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, plan.repositoryOnly
            ? 'Repository-only: formatting, lint, affected source, RI and owning checks. Website build/package/preview/staging/publication are inapplicable.\n'
            : 'Conservative full source and website route.\n');
          NODE
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install the locked source-quality toolchain
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          python3 -m venv tools/quality/toolchain/venv
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check --no-deps ruff==0.16.10 PyYAML==6.0.3 packaging==26.3
      - name: Check maintained formatting
        run: node tools/quality/format.cjs --check
      - name: Check authored dependency and ownership boundaries
        run: node tools/quality/architecture.cjs
      - name: Minimal source, route, script and size checks
        env:
          SITE_REPOSITORY_ONLY: ${{ steps.selection.outputs.repository_only }}
        run: node tools/quality/local.cjs --delivery quality-artifact
      - name: Check complete maintained and generated lint coverage
        env:
          SITE_ARTIFACT_MANIFEST: quality-artifact/artifact.json
          SITE_REPOSITORY_ONLY: ${{ steps.selection.outputs.repository_only }}
          SITE_REPORT_DIR: quality-reports
        run: node tools/quality/scanners.cjs lint
      - name: Run only additional source tests owned by the current PR changes
        env:
          SITE_SOURCE_EVENT: ${{ github.event_name }}
        run: |
          if [ "$SITE_SOURCE_EVENT" = pull_request ]; then
            if [ "${{ steps.selection.outputs.repository_only }}" = true ]; then
              node tools/quality/source-tests.cjs --profile pr --base "$SITE_BASE_SHA" --head "$SITE_CANDIDATE_SHA" --repository-only --require-clean --report quality-reports/source-tests.json
            else
              node tools/quality/source-tests.cjs --profile pr --base "$SITE_BASE_SHA" --head "$SITE_CANDIDATE_SHA" --require-clean --report quality-reports/source-tests.json
            fi
          else
            node tools/quality/source-tests.cjs --profile staging --require-clean --report quality-reports/source-tests.json
          fi
      - name: Retain exact source-test accounting and failure streams
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-source-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-reports/
          if-no-files-found: error
          retention-days: 30
      - name: Retain the protected-base selection
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: delivery-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delivery-selection.json
          if-no-files-found: error
          retention-days: 30
      - id: identity
        if: steps.selection.outputs.repository_only != 'true'
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,'digest='+require('./quality-artifact/artifact.json').artifactDigest+'\n')"
      - id: public
        if: steps.selection.outputs.repository_only != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-public-basic-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Bind successful basic checks to the uploaded artifact
        if: steps.selection.outputs.repository_only != 'true'
        run: node tools/quality/local.cjs --gate quality-artifact
        env:
          SITE_ARTIFACT_ID: ${{ steps.public.outputs.artifact-id }}
          SITE_UPLOAD_DIGEST: ${{ steps.public.outputs.artifact-digest }}
      - id: gate
        if: steps.selection.outputs.repository_only != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-gate-basic-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-artifact/gate/release-manifest.json
          if-no-files-found: error
          retention-days: 30
  staging:
    needs: checks
    if: >-
      vars.SITE_STAGING_ENABLED == 'true' &&
      vars.SITE_PR_STAGING_ENABLED != 'true' &&
      github.repository == 'oborskyivitalii/oborskyivitalii' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.sha == inputs.candidate_sha
    permissions:
      contents: read
      actions: read
      deployments: write
      issues: write
    uses: ./.github/workflows/site-staging.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      public_artifact_id: ${{ needs.checks.outputs.artifact_id }}
      public_digest: ${{ needs.checks.outputs.public_digest }}
      upload_digest: ${{ needs.checks.outputs.artifact_upload_digest }}
      gate_artifact_id: ${{ needs.checks.outputs.gate_artifact_id }}
      gate_upload_digest: ${{ needs.checks.outputs.gate_upload_digest }}
