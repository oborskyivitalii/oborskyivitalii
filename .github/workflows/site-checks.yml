name: Site basic checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact protected-main tip (manual staging source)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  checks:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Prototype source admission deferred' || 'checks' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.public.outputs.artifact-id }}
      artifact_upload_digest: ${{ steps.public.outputs.artifact-digest }}
      public_digest: ${{ steps.identity.outputs.digest }}
      gate_artifact_id: ${{ steps.gate.outputs.artifact-id }}
      gate_upload_digest: ${{ steps.gate.outputs.artifact-digest }}
    env:
      SITE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      SITE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Install the locked source-quality toolchain
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          python3 -m venv tools/quality/toolchain/venv
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check --no-deps ruff==0.16.10 PyYAML==6.0.3
      - name: Check maintained formatting
        run: node tools/quality/format.cjs --check
      - name: Check authored dependency and ownership boundaries
        run: node tools/quality/architecture.cjs
      - name: Minimal source, route, script and size checks
        run: node tools/quality/local.cjs --package quality-artifact
      - name: Check complete maintained and generated lint coverage
        env:
          SITE_ARTIFACT_MANIFEST: quality-artifact/artifact.json
        run: node tools/quality/scanners.cjs lint
      - name: Run only additional source tests owned by the current PR changes
        env:
          SITE_SOURCE_EVENT: ${{ github.event_name }}
        run: |
          if [ "$SITE_SOURCE_EVENT" = pull_request ]; then
            node tools/quality/source-tests.cjs --profile pr --base "$SITE_BASE_SHA" --head "$SITE_CANDIDATE_SHA" --require-clean --report quality-reports/source-tests.json
          else
            node tools/quality/source-tests.cjs --profile staging --require-clean --report quality-reports/source-tests.json
          fi
      - name: Retain exact source-test accounting and failure streams
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-source-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-reports/
          if-no-files-found: error
          retention-days: 30
      - id: identity
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,'digest='+require('./quality-artifact/artifact.json').artifactDigest+'\n')"
      - id: public
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-public-basic-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Bind successful basic checks to the uploaded artifact
        run: node tools/quality/local.cjs --gate quality-artifact
        env:
          SITE_ARTIFACT_ID: ${{ steps.public.outputs.artifact-id }}
          SITE_UPLOAD_DIGEST: ${{ steps.public.outputs.artifact-digest }}
      - id: gate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-gate-basic-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-artifact/gate/release-manifest.json
          if-no-files-found: error
          retention-days: 30
  staging:
    needs: checks
    if: >-
      vars.SITE_STAGING_ENABLED == 'true' &&
      vars.SITE_PR_STAGING_ENABLED != 'true' &&
      github.repository == 'oborskyivitalii/oborskyivitalii' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.sha == inputs.candidate_sha
    permissions:
      contents: read
      actions: read
      deployments: write
      issues: write
    uses: ./.github/workflows/site-staging.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      public_artifact_id: ${{ needs.checks.outputs.artifact_id }}
      public_digest: ${{ needs.checks.outputs.public_digest }}
      upload_digest: ${{ needs.checks.outputs.artifact_upload_digest }}
      gate_artifact_id: ${{ needs.checks.outputs.gate_artifact_id }}
      gate_upload_digest: ${{ needs.checks.outputs.gate_upload_digest }}

  pr40-once-integrate:
    name: One-time PR68 selected editorial regeneration
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 40 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Read exact PR68 source and integrate selected authored editors
        run: |
          test "$(git rev-parse HEAD~3)" = "44a9586e383c0ec2d172df5e77712e956f272f6d"
          git fetch --no-tags origin c3b8fb7d0b7a127363f24cdacb8a36c3f811054a
          python3 tools/quality/pr40-editorial-bridge.py
          git show "44a9586e383c0ec2d172df5e77712e956f272f6d:.github/workflows/site-checks.yml" > .github/workflows/site-checks.yml
          git rm -f tools/quality/pr40-editorial-bridge.py
      - name: Restore exact path catalog for new authored and generated paths
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          p=pathlib.Path('.github/repository-paths.json')
          doc=json.loads(p.read_text())
          entries=doc['entries']
          for path in ['review/issue-41/2026-10-10-arkadiy-amendment.json','review/issue-41/2026-10-10-arkadiy-topic-amendment.json','review/issue-41/2026-10-10-author-first-amendment.json','review/issue-39/2026-10-16-positioning-integration.md']:
              entries[path]={'kind':'file','purpose':'Versioned PR68 editorial source evidence or selected PR40 integration decision','role':'history','owner':'CONTRIBUTING.md'}
          p.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Install pinned source format dependencies
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts --no-audit --no-fund
          python3 -m venv tools/quality/toolchain/venv
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check --no-deps ruff==0.16.10 PyYAML==6.0.3
      - name: Regenerate exact authored site, previews and retained output
        run: |
          node tools/quality/format.cjs --write
          node tools/site/build.cjs --all
          node tools/build_site_previews.cjs
          python3 tools/build_site_bundle.py
          python3 - <<'PY'
          import json, pathlib, subprocess
          p=pathlib.Path('.github/repository-paths.json')
          doc=json.loads(p.read_text())
          e=doc['entries']
          files=[f for f in subprocess.check_output(['git','ls-files','-z','--cached','--others','--exclude-standard']).decode().split('\x00') if f and pathlib.Path(f).is_file()]
          dirs=set()
          for f in files:
              q=pathlib.PurePosixPath(f)
              for parent in q.parents:
                  if str(parent)!='.':dirs.add(str(parent))
          for f in files:
              if f not in e:
                  if f.startswith('docs/snapshots/'):
                      e[f]={'kind':'file','purpose':'Generated immutable source rendition produced by the site engine','role':'generated','owner':'site/README.md'}
                  else:raise RuntimeError('Undeclared file '+f)
          for d in dirs:
              if d not in e:
                  if d.startswith('docs/snapshots/'):
                      e[d]={'kind':'directory','purpose':'Generated immutable route snapshot directory','role':'generated','owner':'site/README.md'}
                  else:raise RuntimeError('Undeclared directory '+d)
          for path in list(e):
              if path.startswith('docs/snapshots/') and path not in dirs and path not in files:
                  del e[path]
          doc['entries']=dict(sorted(e.items()))
          p.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 tools/check_ri_ci.py refresh
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json build
      - name: Verify content, exact legal and technical contracts
        run: |
          node tools/site/build.cjs --check
          node tools/build_site_previews.cjs --check
          python3 tools/build_site_bundle.py --check
          node tools/check_site_seo.cjs > /tmp/pr40-editorial-seo.json
          node --test tests/content.test.cjs
          node tools/quality/format.cjs --check
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json verify
          python3 tools/check_ri_ci.py verify
          node tools/quality/local.cjs
          git diff --check
      - name: Commit and publish integrated Draft PR40 source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate selected PR68 author-first editorial content into PR40 preview" -m "Refs #39" -m "Refs #41"
          git push origin HEAD:refs/heads/work/github-pages-domains-39
