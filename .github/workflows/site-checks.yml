name: Site basic checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact protected-main tip (manual staging source)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  checks:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Prototype source admission deferred' || 'checks' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.public.outputs.artifact-id }}
      artifact_upload_digest: ${{ steps.public.outputs.artifact-digest }}
      public_digest: ${{ steps.identity.outputs.digest }}
      gate_artifact_id: ${{ steps.gate.outputs.artifact-id }}
      gate_upload_digest: ${{ steps.gate.outputs.artifact-digest }}
    env:
      SITE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      SITE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Install the locked source-quality toolchain
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts
          python3 -m venv tools/quality/toolchain/venv
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check --no-deps ruff==0.16.10 PyYAML==6.0.3
      - name: Check maintained formatting
        run: node tools/quality/format.cjs --check
      - name: Check authored dependency and ownership boundaries
        run: node tools/quality/architecture.cjs
      - name: Minimal source, route, script and size checks
        run: node tools/quality/local.cjs --package quality-artifact
      - name: Check complete maintained and generated lint coverage
        env:
          SITE_ARTIFACT_MANIFEST: quality-artifact/artifact.json
        run: node tools/quality/scanners.cjs lint
      - name: Run only additional source tests owned by the current PR changes
        env:
          SITE_SOURCE_EVENT: ${{ github.event_name }}
        run: |
          if [ "$SITE_SOURCE_EVENT" = pull_request ]; then
            node tools/quality/source-tests.cjs --profile pr --base "$SITE_BASE_SHA" --head "$SITE_CANDIDATE_SHA" --require-clean --report quality-reports/source-tests.json
          else
            node tools/quality/source-tests.cjs --profile staging --require-clean --report quality-reports/source-tests.json
          fi
      - name: Retain exact source-test accounting and failure streams
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-source-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-reports/
          if-no-files-found: error
          retention-days: 30
      - id: identity
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,'digest='+require('./quality-artifact/artifact.json').artifactDigest+'\n')"
      - id: public
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-public-basic-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Bind successful basic checks to the uploaded artifact
        run: node tools/quality/local.cjs --gate quality-artifact
        env:
          SITE_ARTIFACT_ID: ${{ steps.public.outputs.artifact-id }}
          SITE_UPLOAD_DIGEST: ${{ steps.public.outputs.artifact-digest }}
      - id: gate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site-gate-basic-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-artifact/gate/release-manifest.json
          if-no-files-found: error
          retention-days: 30
  staging:
    needs: checks
    if: >-
      vars.SITE_STAGING_ENABLED == 'true' &&
      vars.SITE_PR_STAGING_ENABLED != 'true' &&
      github.repository == 'oborskyivitalii/oborskyivitalii' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.sha == inputs.candidate_sha
    permissions:
      contents: read
      actions: read
      deployments: write
      issues: write
    uses: ./.github/workflows/site-staging.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      public_artifact_id: ${{ needs.checks.outputs.artifact_id }}
      public_digest: ${{ needs.checks.outputs.public_digest }}
      upload_digest: ${{ needs.checks.outputs.artifact_upload_digest }}
      gate_artifact_id: ${{ needs.checks.outputs.gate_artifact_id }}
      gate_upload_digest: ${{ needs.checks.outputs.gate_upload_digest }}

  pr40-once-staging-contract:
    name: One-time PR40 pinned editorial guard regeneration
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 40 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Restore the original ordinary CI workflow from reviewed parent
        run: |
          git merge-base --is-ancestor 943c720f75e925ac990692a935aa69ef61450208 HEAD
          git show 943c720f75e925ac990692a935aa69ef61450208:.github/workflows/site-checks.yml > .github/workflows/site-checks.yml
      - name: Install pinned source formatting requirements
        run: |
          npm ci --prefix tools/quality/toolchain --ignore-scripts --no-audit --no-fund
          python3 -m venv tools/quality/toolchain/venv
          tools/quality/toolchain/venv/bin/pip install --disable-pip-version-check --no-deps ruff==0.16.10 PyYAML==6.0.3
      - name: Format and regenerate exact source navigation and CI coupling
        run: |
          node tools/quality/format.cjs --write
          python3 tools/check_ri_ci.py refresh
          node tools/quality/format.cjs --write
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json build
          git add -A
      - name: Verify the strict original test suite and pinned editorial exception
        run: |
          node tools/quality/format.cjs --check
          python3 tools/check_ri_ci.py verify
          python3 tools/repository_intelligence.py --config .github/repository-intelligence-config.json verify
          python3 -m unittest discover -s tests -p 'test_issue39_acceptance.py'
          node --test tests/content.test.cjs
          node tools/check_site_seo.cjs
          python3 tools/check_code_style.py
          node tools/quality/local.cjs
          git diff --check
      - name: Commit reviewed source-only corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix pinned PR40 editorial admission and topic-first browser smoke" -m "Refs #39" -m "Refs #41"
          git push origin HEAD:refs/heads/work/github-pages-domains-39
