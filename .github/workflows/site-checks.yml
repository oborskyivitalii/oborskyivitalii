name: Site PR checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character source commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  checks:
    uses: ./.github/workflows/site-release-checks.yml
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
      full: false
